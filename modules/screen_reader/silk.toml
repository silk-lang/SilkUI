[package]
name = "ui-screen-reader"
description = "A screen reader for development: reads an AccessKit tree the way VoiceOver, NVDA, JAWS, Narrator and Orca do, with their keys and their phrasing"
version = "0.1.0"
silk-version = "0.1.0-dev.87+37fa5f8857de"
kind = "library"
exports = ["lib", "command", "document", "flavor", "reader"]

[dependencies]
accesskit = { path = "../accesskit", package = "accesskit" }
accesskit_consumer = { path = "../accesskit/consumer", package = "accesskit-consumer" }
