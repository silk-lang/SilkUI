[package]
name = "ui-tree"
description = "The retained UI tree: plain-data mutations, CSS layout, painting into a UI scene"
version = "0.1.0"
silk-version = "0.1.0-dev.74+205aea3f5b2e"
kind = "library"
exports = ["lib", "access", "legacy", "engine", "mutation", "css", "style", "resources", "provider", "node", "paint", "tree", "id", "event", "error", "inspect", "batch", "grid", "grid_css", "expand", "canvas_text", "input", "interact", "scrollbar", "edit", "rich", "caret", "virtual_list", "canvas_view", "anchoring", "image_load", "cssom_view", "transform", "paint_css", "paint_effects", "style_identity", "selection", "placeholder", "scrollbar_parts", "sheet_faces", "selector_tree", "containers", "container_watch", "style_assets", "style_media", "style_compiler", "style_runtime", "style_load", "process_memory"]

[dependencies]
