[package]
name = "ui-tree"
description = "The retained UI tree: plain-data mutations, CSS layout, painting into a UI scene"
version = "0.1.0"
kind = "library"
exports = ["lib", "canvas2d", "access", "legacy", "engine", "mutation", "css", "style", "resources", "provider", "node", "paint", "tree", "id", "event", "error", "inspect", "batch", "grid", "grid_css", "expand", "canvas_text", "input", "interact", "scrollbar", "edit", "rich", "caret", "virtual_list", "canvas_view", "anchoring", "image_load", "cssom_view", "transform", "paint_css", "paint_effects", "style_identity", "selection", "text_selection", "placeholder", "scrollbar_parts", "sheet_faces", "selector_tree", "containers", "container_watch", "style_assets", "style_media", "style_compiler", "style_runtime", "style_load", "process_memory", "computed_style", "observers", "css_cursor", "battery", "query", "live_svg", "digest", "layout_table", "thin", "census"]

[dependencies]
accesskit = { path = "../accesskit", package = "accesskit" }
ui_protocol = { path = "../protocol", package = "ui-protocol" }
layout = { git = "https://github.com/silk-lang/lib-css.git", rev = "434ad4d0526ed3e9feb3d545e31536f9b82f3f79", path = "modules/layout", package = "css-layout" }
properties = { git = "https://github.com/silk-lang/lib-css.git", rev = "434ad4d0526ed3e9feb3d545e31536f9b82f3f79", path = "modules/properties", package = "css-properties" }
ui_text = { path = "../text", package = "ui-text" }
font_collection = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "dba368fec15f515a9eef8a557bf1244c8475984c", path = "modules/collection", package = "font-collection" }
font_raster = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "dba368fec15f515a9eef8a557bf1244c8475984c", path = "modules/raster", package = "font-raster" }
read_fonts = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "dba368fec15f515a9eef8a557bf1244c8475984c", path = "modules/parse", package = "font-parse" }
atlas = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "0114e9930cdd85b05bf591e908a5c73940de4888", path = "modules/atlas", package = "graphics-atlas" }
ui_scene = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "0114e9930cdd85b05bf591e908a5c73940de4888", path = "modules/ui_scene", package = "graphics-ui-scene" }
sprites = { path = "../sprites", package = "ui-sprites" }
vector = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "0114e9930cdd85b05bf591e908a5c73940de4888", path = "modules/vector", package = "graphics-vector" }
codec = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "0114e9930cdd85b05bf591e908a5c73940de4888", path = "modules/codec", package = "graphics-codec" }
svg_render = { git = "https://github.com/silk-lang/lib-svg.git", rev = "265560ae3f555d6c5a9244d386885cc2b92883b4", path = "modules/render", package = "svg-render" }
svg_core = { git = "https://github.com/silk-lang/lib-svg.git", rev = "265560ae3f555d6c5a9244d386885cc2b92883b4", path = "modules", package = "svg" }
svg_text = { git = "https://github.com/silk-lang/lib-svg.git", rev = "265560ae3f555d6c5a9244d386885cc2b92883b4", path = "modules/text", package = "svg-text" }
svg_css = { git = "https://github.com/silk-lang/lib-css.git", rev = "434ad4d0526ed3e9feb3d545e31536f9b82f3f79", path = "modules/style", package = "css-style" }
svg_fonts = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "dba368fec15f515a9eef8a557bf1244c8475984c", path = "modules/faces", package = "font-faces" }
svg_geometry = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "0114e9930cdd85b05bf591e908a5c73940de4888", path = "modules/geometry", package = "graphics-geometry" }
