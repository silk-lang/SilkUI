[package]
name = "ui-tree"
description = "The retained UI tree: plain-data mutations, CSS layout, painting into a UI scene"
version = "0.1.0"
kind = "library"
exports = ["lib", "access", "legacy", "engine", "mutation", "css", "style", "resources", "provider", "node", "paint", "tree", "id", "event", "error", "inspect", "batch", "grid", "grid_css", "expand", "canvas_text", "input", "interact", "scrollbar", "edit", "rich", "caret", "virtual_list", "canvas_view", "anchoring", "image_load", "cssom_view", "transform", "paint_css", "paint_effects", "style_identity", "selection", "text_selection", "placeholder", "scrollbar_parts", "sheet_faces", "selector_tree", "containers", "container_watch", "style_assets", "style_media", "style_compiler", "style_runtime", "style_load", "process_memory", "computed_style", "observers", "css_cursor", "battery", "query", "live_svg", "digest", "layout_table", "thin", "census"]

[dependencies]
accesskit = { path = "../accesskit", package = "accesskit" }
ui_protocol = { path = "../protocol", package = "ui-protocol" }
layout = { git = "https://github.com/silk-lang/lib-css.git", rev = "c4bce4e90c7341d4974d578d9712072076da4d3c", path = "modules/layout", package = "css-layout" }
properties = { git = "https://github.com/silk-lang/lib-css.git", rev = "c4bce4e90c7341d4974d578d9712072076da4d3c", path = "modules/properties", package = "css-properties" }
ui_text = { path = "../text", package = "ui-text" }
font_collection = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "ac46401d637fc7f658d88ff17ea13b0eb71ca974", path = "modules/collection", package = "font-collection" }
font_raster = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "ac46401d637fc7f658d88ff17ea13b0eb71ca974", path = "modules/raster", package = "font-raster" }
read_fonts = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "ac46401d637fc7f658d88ff17ea13b0eb71ca974", path = "modules/parse", package = "font-parse" }
atlas = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "a11493a2ed16ec2767845090454b5ce1aa7d7eee", path = "modules/atlas", package = "graphics-atlas" }
ui_scene = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "a11493a2ed16ec2767845090454b5ce1aa7d7eee", path = "modules/ui_scene", package = "graphics-ui-scene" }
sprites = { path = "../sprites", package = "ui-sprites" }
vector = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "a11493a2ed16ec2767845090454b5ce1aa7d7eee", path = "modules/vector", package = "graphics-vector" }
codec = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "a11493a2ed16ec2767845090454b5ce1aa7d7eee", path = "modules/codec", package = "graphics-codec" }
svg_render = { git = "https://github.com/silk-lang/lib-svg.git", rev = "a7534112ec504ac6cabd62c521562099e1f4442c", path = "modules/render", package = "svg-render" }
svg_core = { git = "https://github.com/silk-lang/lib-svg.git", rev = "a7534112ec504ac6cabd62c521562099e1f4442c", path = "modules", package = "svg" }
svg_text = { git = "https://github.com/silk-lang/lib-svg.git", rev = "a7534112ec504ac6cabd62c521562099e1f4442c", path = "modules/text", package = "svg-text" }
svg_css = { git = "https://github.com/silk-lang/lib-css.git", rev = "c4bce4e90c7341d4974d578d9712072076da4d3c", path = "modules/style", package = "css-style" }
svg_fonts = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "ac46401d637fc7f658d88ff17ea13b0eb71ca974", path = "modules/faces", package = "font-faces" }
svg_geometry = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "a11493a2ed16ec2767845090454b5ce1aa7d7eee", path = "modules/geometry", package = "graphics-geometry" }
