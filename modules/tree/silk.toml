ui_protocol = { path = "../protocol", package = "ui-protocol" }
layout = { git = "https://github.com/silk-lang/lib-css.git", rev = "49604d99f84b2bb245aad297e92901c58a36b951", path = "modules/layout", package = "css-layout" }
properties = { git = "https://github.com/silk-lang/lib-css.git", rev = "49604d99f84b2bb245aad297e92901c58a36b951", path = "modules/properties", package = "css-properties" }
