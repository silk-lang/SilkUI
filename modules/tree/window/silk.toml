[package]
name = "ui-tree-window"
description = "Hosts a ui-tree in a platform window"
version = "0.1.0"
silk-version = "0.1.0-dev.74+205aea3f5b2e"
kind = "library"
exports = ["lib", "adapter", "keys", "accessibility", "host", "background", "images", "loader", "sheets", "style_watch", "remote", "render_thread", "render_inline", "platform_thread", "console", "clock", "browser", "companion", "web_access", "headless", "screen_reader", "speech"]

[dependencies]
ui_protocol = { path = "../../protocol", package = "ui-protocol" }
ui_tree = { path = "..", package = "ui-tree" }
accesskit = { path = "../../accesskit", package = "accesskit" }
ui_screen_reader = { path = "../../screen_reader", package = "ui-screen-reader" }
accesskit_macos = { path = "../../accesskit/macos", package = "accesskit-macos" }
accesskit_windows = { path = "../../accesskit/windows", package = "accesskit-windows" }
accesskit_unix = { path = "../../accesskit/unix", package = "accesskit-unix" }
dbus = { path = "../../dbus", package = "dbus" }
window = { git = "https://github.com/silk-lang/lib-native.git", rev = "195402d6e0408f2be684bab7bc8b5c8719915e36", path = "modules/platform/window", package = "platform-window" }

ui_inspect_server = { path = "../../inspect/server", package = "ui-inspect-server" }
font_web = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "177e6bb9874828eff4ead70793b490c5ed62477c", path = "modules/web", package = "font-web" }
font_collection = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "177e6bb9874828eff4ead70793b490c5ed62477c", path = "modules/collection", package = "font-collection" }
atlas = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "62fbfe032c224bca5c679f8b6c2a33a2a5cf6b70", path = "modules/atlas", package = "graphics-atlas" }
vector = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "62fbfe032c224bca5c679f8b6c2a33a2a5cf6b70", path = "modules/vector", package = "graphics-vector" }
ui_scene = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "62fbfe032c224bca5c679f8b6c2a33a2a5cf6b70", path = "modules/ui_scene", package = "graphics-ui-scene" }
ui_renderer = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "62fbfe032c224bca5c679f8b6c2a33a2a5cf6b70", path = "modules/ui_renderer", package = "graphics-ui-renderer" }
webgpu = { git = "https://github.com/silk-lang/lib-native.git", rev = "7166a093a36a64be92125f428ed8db5daf211b5b", path = "modules/gpu/webgpu", package = "gpu-webgpu" }
webgpu_sys = { git = "https://github.com/silk-lang/lib-native.git", rev = "7166a093a36a64be92125f428ed8db5daf211b5b", path = "modules/gpu/webgpu/sys", package = "gpu-webgpu-sys" }
codec = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "62fbfe032c224bca5c679f8b6c2a33a2a5cf6b70", path = "modules/codec", package = "graphics-codec" }

# The Metal Performance HUD switch (native/metal_hud.m). Other platforms compile nothing here.
[native]
sources = [
  { objc = "native/metal_hud.m", flags = ["-fobjc-arc", "-fblocks", "-O2", "-Wall", "-Wextra", "-Werror", "-mmacosx-version-min=11.0"], os = "macos" },
]
link = [
  { framework = "QuartzCore", os = "macos" },
]
