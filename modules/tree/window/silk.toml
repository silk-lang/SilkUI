[package]
include = ["browser"]
name = "ui-tree-window"
description = "Hosts a ui-tree in a platform window"
version = "0.1.0"
kind = "library"
exports = ["lib", "adapter", "keys", "accessibility", "host", "background", "images", "loader", "sheets", "style_watch", "remote", "render_thread", "render_inline", "platform_thread", "console", "clock", "browser", "companion", "web_access", "headless", "screen_reader", "speech"]

[dependencies]
ui_protocol = { path = "../../protocol", package = "ui-protocol" }
ui_screen_reader = { path = "../../screen_reader", package = "ui-screen-reader" }
ui_tree = { path = "..", package = "ui-tree" }
accesskit = { path = "../../accesskit", package = "accesskit" }
accesskit_macos = { path = "../../accesskit/macos", package = "accesskit-macos" }
accesskit_windows = { path = "../../accesskit/windows", package = "accesskit-windows" }
accesskit_unix = { path = "../../accesskit/unix", package = "accesskit-unix" }
dbus = { path = "../../dbus", package = "dbus" }
window = { git = "https://github.com/silk-lang/lib-native.git", rev = "2be8cba70651433892d24c137badc326627af07f", path = "modules/platform/window", package = "platform-window" }

ui_inspect_server = { path = "../../inspect/server", package = "ui-inspect-server" }
font_web = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "f78c62feabd50b0f8cd444d97ec2f939bf8a9d9a", path = "modules/web", package = "font-web" }
font_collection = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "f78c62feabd50b0f8cd444d97ec2f939bf8a9d9a", path = "modules/collection", package = "font-collection" }
atlas = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "0c0b592f53afeb0b8fb2ab0552adf71df0267d0c", path = "modules/atlas", package = "graphics-atlas" }
vector = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "0c0b592f53afeb0b8fb2ab0552adf71df0267d0c", path = "modules/vector", package = "graphics-vector" }
ui_scene = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "0c0b592f53afeb0b8fb2ab0552adf71df0267d0c", path = "modules/ui_scene", package = "graphics-ui-scene" }
ui_renderer = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "0c0b592f53afeb0b8fb2ab0552adf71df0267d0c", path = "modules/ui_renderer", package = "graphics-ui-renderer" }
webgpu = { git = "https://github.com/silk-lang/lib-native.git", rev = "2be8cba70651433892d24c137badc326627af07f", path = "modules/gpu/webgpu", package = "gpu-webgpu" }
webgpu_sys = { git = "https://github.com/silk-lang/lib-native.git", rev = "2be8cba70651433892d24c137badc326627af07f", path = "modules/gpu/webgpu/sys", package = "gpu-webgpu-sys" }
codec = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "0c0b592f53afeb0b8fb2ab0552adf71df0267d0c", path = "modules/codec", package = "graphics-codec" }

