[package]
include = ["browser"]
name = "ui-tree-window"
description = "Hosts a ui-tree in a platform window"
version = "0.1.0"
silk-version = "0.1.0-dev.74+205aea3f5b2e"
kind = "library"
exports = ["lib", "adapter", "keys", "accessibility", "host", "background", "images", "loader", "sheets", "remote", "render_thread", "render_inline", "platform_thread", "console", "clock", "browser", "companion", "web_access"]

[dependencies]
ui_tree = { path = "..", package = "ui-tree" }
accesskit = { path = "../../accesskit", package = "accesskit" }
accesskit_macos = { path = "../../accesskit/macos", package = "accesskit-macos" }
accesskit_windows = { path = "../../accesskit/windows", package = "accesskit-windows" }
accesskit_unix = { path = "../../accesskit/unix", package = "accesskit-unix" }
dbus = { path = "../../dbus", package = "dbus" }
window = { git = "https://github.com/silk-lang/lib-native.git", rev = "b40277a5a58d7ddf679cff350e8ee0f02388ef3f", path = "modules/platform/window", package = "platform-window" }

ui_inspect_server = { path = "../../inspect/server", package = "ui-inspect-server" }
font_web = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "7667e203b385ba0d0d704f88a9cd37b1859148a6", path = "modules/web", package = "font-web" }
font_collection = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "7667e203b385ba0d0d704f88a9cd37b1859148a6", path = "modules/collection", package = "font-collection" }
atlas = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "1ba6e77674b908b534db11b9654dd0e7539a8bac", path = "modules/atlas", package = "graphics-atlas" }
vector = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "1ba6e77674b908b534db11b9654dd0e7539a8bac", path = "modules/vector", package = "graphics-vector" }
ui_scene = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "1ba6e77674b908b534db11b9654dd0e7539a8bac", path = "modules/ui_scene", package = "graphics-ui-scene" }
ui_renderer = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "1ba6e77674b908b534db11b9654dd0e7539a8bac", path = "modules/ui_renderer", package = "graphics-ui-renderer" }
webgpu = { git = "https://github.com/silk-lang/lib-native.git", rev = "b40277a5a58d7ddf679cff350e8ee0f02388ef3f", path = "modules/gpu/webgpu", package = "gpu-webgpu" }
webgpu_sys = { git = "https://github.com/silk-lang/lib-native.git", rev = "b40277a5a58d7ddf679cff350e8ee0f02388ef3f", path = "modules/gpu/webgpu/sys", package = "gpu-webgpu-sys" }
codec = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "1ba6e77674b908b534db11b9654dd0e7539a8bac", path = "modules/codec", package = "graphics-codec" }
