[package]
include = ["browser"]
name = "ui-tree-window"
description = "Hosts a ui-tree in a platform window"
version = "0.1.0"
silk-version = "0.1.0-pipeline.1"
kind = "library"
exports = ["lib", "adapter", "keys", "accessibility", "host", "background", "images", "loader", "sheets", "remote", "render_thread", "render_inline", "platform_thread", "console", "clock", "browser", "companion", "web_access"]

[dependencies]
ui_tree = { path = "..", package = "ui-tree" }
accesskit = { path = "../../accesskit", package = "accesskit" }
accesskit_macos = { path = "../../accesskit/macos", package = "accesskit-macos" }
accesskit_windows = { path = "../../accesskit/windows", package = "accesskit-windows" }
accesskit_unix = { path = "../../accesskit/unix", package = "accesskit-unix" }
dbus = { path = "../../dbus", package = "dbus" }
window = { git = "https://github.com/silk-lang/lib-native.git", rev = "8b411d1f2e4848a6a93d5cf26b488cd52db64069", path = "modules/platform/window", package = "platform-window" }

ui_inspect_server = { path = "../../inspect/server", package = "ui-inspect-server" }
font_web = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "c6df88819e2f99ad73051d5254271b5a5cb24e7c", path = "modules/web", package = "font-web" }
font_collection = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "c6df88819e2f99ad73051d5254271b5a5cb24e7c", path = "modules/collection", package = "font-collection" }
atlas = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "4a90de327acd6f62d060019ab49dba5490262f69", path = "modules/atlas", package = "graphics-atlas" }
vector = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "4a90de327acd6f62d060019ab49dba5490262f69", path = "modules/vector", package = "graphics-vector" }
ui_scene = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "4a90de327acd6f62d060019ab49dba5490262f69", path = "modules/ui_scene", package = "graphics-ui-scene" }
ui_renderer = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "4a90de327acd6f62d060019ab49dba5490262f69", path = "modules/ui_renderer", package = "graphics-ui-renderer" }
webgpu = { git = "https://github.com/silk-lang/lib-native.git", rev = "8b411d1f2e4848a6a93d5cf26b488cd52db64069", path = "modules/gpu/webgpu", package = "gpu-webgpu" }
webgpu_sys = { git = "https://github.com/silk-lang/lib-native.git", rev = "8b411d1f2e4848a6a93d5cf26b488cd52db64069", path = "modules/gpu/webgpu/sys", package = "gpu-webgpu-sys" }
codec = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "4a90de327acd6f62d060019ab49dba5490262f69", path = "modules/codec", package = "graphics-codec" }
