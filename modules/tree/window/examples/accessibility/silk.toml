[package]
name = "ui-tree-window-accessibility-example"
description = "A tree published to the desktop's assistive technology through the window host's accessibility bridge"
version = "0.1.0"
silk-version = "0.1.0-dev.87+37fa5f8857de"
kind = "executable"

[dependencies]
ui_tree = { path = "../../..", package = "ui-tree" }
ui_tree_window = { path = "../..", package = "ui-tree-window" }
ui_fixtures = { path = "../../../fixtures", package = "ui-tree-fixtures" }
window = { git = "https://github.com/silk-lang/lib-native.git", rev = "a8170004bd756415fd9242409d49f9d7bcbb140b", path = "modules/platform/window", package = "platform-window" }
