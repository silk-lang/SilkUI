[package]
name = "ui-inspect-server"
description = "The inspector protocol: a running UI answers JSON requests on a local socket"
version = "0.1.0"
kind = "library"
exports = ["lib", "devtools", "channel", "topics", "session", "reply", "names", "remote", "extension", "protocol", "nodes", "tools", "edits", "timeline", "server", "client", "mcp", "commands", "cli", "shots"]

[dependencies]
ui_inspect = { path = "..", package = "ui-inspect" }
ui_tree = { path = "../../tree", package = "ui-tree" }
ui_scene = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "8ee2fd99c1f9da1e9f1bc491861ea466dcaadb96", path = "modules/ui_scene", package = "graphics-ui-scene" }
vector = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "8ee2fd99c1f9da1e9f1bc491861ea466dcaadb96", path = "modules/vector", package = "graphics-vector" }
codec = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "8ee2fd99c1f9da1e9f1bc491861ea466dcaadb96", path = "modules/codec", package = "graphics-codec" }
css_style = { git = "https://github.com/silk-lang/lib-css.git", rev = "bc4b81d2b3b211db4cc37f40f5f1cc6721c47250", path = "modules/style", package = "css-style" }
