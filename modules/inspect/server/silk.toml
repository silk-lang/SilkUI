[package]
name = "ui-inspect-server"
description = "The inspector protocol: a running UI answers JSON requests on a local socket"
version = "0.1.0"
silk-version = "0.1.0-dev.74+205aea3f5b2e"
kind = "library"
exports = ["lib", "channel", "topics", "session", "reply", "names", "remote", "extension", "protocol", "nodes", "tools", "edits", "timeline", "server", "client", "mcp", "commands"]

[dependencies]
ui_inspect = { path = "..", package = "ui-inspect" }
ui_tree = { path = "../../tree", package = "ui-tree" }
ui_scene = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "7b3932632e4c07cca1fff5b4467c72f1e392119b", path = "modules/ui_scene", package = "graphics-ui-scene" }
vector = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "7b3932632e4c07cca1fff5b4467c72f1e392119b", path = "modules/vector", package = "graphics-vector" }
codec = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "7b3932632e4c07cca1fff5b4467c72f1e392119b", path = "modules/codec", package = "graphics-codec" }
css_style = { git = "https://github.com/silk-lang/lib-css.git", rev = "c537afde8e4afc04196a64dbd9f47dad7b74c5d2", path = "modules/style", package = "css-style" }
