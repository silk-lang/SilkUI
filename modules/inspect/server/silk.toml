[package]
name = "ui-inspect-server"
description = "The inspector protocol: a running UI answers JSON requests on a local socket"
version = "0.1.0"
silk-version = "0.1.0-dev.87+37fa5f8857de"
kind = "library"
exports = ["lib", "channel", "topics", "session", "reply", "names", "remote", "extension", "protocol", "nodes", "tools", "edits", "timeline", "server", "client", "mcp", "commands"]

[dependencies]
ui_inspect = { path = "..", package = "ui-inspect" }
ui_tree = { path = "../../tree", package = "ui-tree" }
ui_scene = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "7b5b880008afdccec630e8afe3c234a9b670ae79", path = "modules/ui_scene", package = "graphics-ui-scene" }
vector = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "7b5b880008afdccec630e8afe3c234a9b670ae79", path = "modules/vector", package = "graphics-vector" }
codec = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "7b5b880008afdccec630e8afe3c234a9b670ae79", path = "modules/codec", package = "graphics-codec" }
css_style = { git = "https://github.com/silk-lang/lib-css.git", rev = "7d61ad4498a85499fafa670bc0a9525219e5527c", path = "modules/style", package = "css-style" }
