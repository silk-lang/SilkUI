[package]
name = "ui-inspect-server"
description = "The inspector protocol: a running UI answers JSON requests on a local socket"
version = "0.1.0"
silk-version = "0.1.0-pipeline.1"
kind = "library"
exports = ["lib", "channel", "topics", "session", "reply", "names", "remote", "extension", "protocol", "nodes", "tools", "edits", "timeline", "server", "client", "mcp"]

[dependencies]
ui_inspect = { path = "..", package = "ui-inspect" }
ui_tree = { path = "../../tree", package = "ui-tree" }
ui_scene = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "4a90de327acd6f62d060019ab49dba5490262f69", path = "modules/ui_scene", package = "graphics-ui-scene" }
vector = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "4a90de327acd6f62d060019ab49dba5490262f69", path = "modules/vector", package = "graphics-vector" }
codec = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "4a90de327acd6f62d060019ab49dba5490262f69", path = "modules/codec", package = "graphics-codec" }
css_style = { git = "https://github.com/silk-lang/lib-css.git", rev = "28191216b251c4625e9f840a17424e99251e3c4f", path = "modules/style", package = "css-style" }
