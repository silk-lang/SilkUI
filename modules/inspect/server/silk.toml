[package]
name = "ui-inspect-server"
description = "The inspector protocol: a running UI answers JSON requests on a local socket"
version = "0.1.0"
kind = "library"
exports = ["lib", "channel", "topics", "session", "reply", "names", "remote", "extension", "protocol", "nodes", "tools", "edits", "timeline", "server", "client", "mcp", "commands"]

[dependencies]
ui_inspect = { path = "..", package = "ui-inspect" }
ui_tree = { path = "../../tree", package = "ui-tree" }
ui_scene = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "19746fc2516860bea1eb1e367566bc434b9e335a", path = "modules/ui_scene", package = "graphics-ui-scene" }
vector = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "19746fc2516860bea1eb1e367566bc434b9e335a", path = "modules/vector", package = "graphics-vector" }
codec = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "19746fc2516860bea1eb1e367566bc434b9e335a", path = "modules/codec", package = "graphics-codec" }
css_style = { git = "https://github.com/silk-lang/lib-css.git", rev = "f1589b2e9a909a7ff67b836585530a545021c591", path = "modules/style", package = "css-style" }
