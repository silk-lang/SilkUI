[package]
name = "ui-inspect"
description = "The inspector core for ui-tree: snapshots, queries and input for people, tests and agents"
version = "0.1.0"
kind = "library"
exports = ["lib", "query", "overlay", "view", "session", "synth"]

[dependencies]
ui_tree = { path = "../tree", package = "ui-tree" }
ui_protocol = { path = "../protocol", package = "ui-protocol" }
properties = { git = "https://github.com/silk-lang/lib-css.git", rev = "a99f4d1ee666a2732b99d3cb51dae051e2bb1f0b", path = "modules/properties", package = "css-properties" }
layout = { git = "https://github.com/silk-lang/lib-css.git", rev = "a99f4d1ee666a2732b99d3cb51dae051e2bb1f0b", path = "modules/layout", package = "css-layout" }
ui_scene = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "a4cc4a88efdcc88d9e0f14ad62710f71c0069c8c", path = "modules/ui_scene", package = "graphics-ui-scene" }
vector = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "a4cc4a88efdcc88d9e0f14ad62710f71c0069c8c", path = "modules/vector", package = "graphics-vector" }
