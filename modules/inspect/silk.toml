[package]
name = "ui-inspect"
description = "The inspector core for ui-tree: snapshots, queries and input for people, tests and agents"
version = "0.1.0"
silk-version = "0.1.0-dev.74+205aea3f5b2e"
kind = "library"
exports = ["lib", "query", "overlay", "view", "session", "synth"]

[dependencies]
ui_tree = { path = "../tree", package = "ui-tree" }
ui_protocol = { path = "../protocol", package = "ui-protocol" }
properties = { git = "https://github.com/silk-lang/lib-css.git", rev = "a8b1c8f85f0d601a70c18af66169aea06e00b4c0", path = "modules/properties", package = "css-properties" }
layout = { git = "https://github.com/silk-lang/lib-css.git", rev = "a8b1c8f85f0d601a70c18af66169aea06e00b4c0", path = "modules/layout", package = "css-layout" }
ui_scene = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "2cf97d2d406b76b39d0d1a13e871c88ad190d314", path = "modules/ui_scene", package = "graphics-ui-scene" }
vector = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "2cf97d2d406b76b39d0d1a13e871c88ad190d314", path = "modules/vector", package = "graphics-vector" }
