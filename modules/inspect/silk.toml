[package]
name = "ui-inspect"
description = "The inspector core for ui-tree: snapshots, queries and input for people, tests and agents"
version = "0.1.0"
kind = "library"
exports = ["lib", "query", "overlay", "view", "session", "synth"]

[dependencies]
ui_tree = { path = "../tree", package = "ui-tree" }
ui_protocol = { path = "../protocol", package = "ui-protocol" }
properties = { git = "https://github.com/silk-lang/lib-css.git", rev = "edf5c291a8cfdef5b0e34c3e58f452cae5a8b14f", path = "modules/properties", package = "css-properties" }
layout = { git = "https://github.com/silk-lang/lib-css.git", rev = "edf5c291a8cfdef5b0e34c3e58f452cae5a8b14f", path = "modules/layout", package = "css-layout" }
ui_scene = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "8ee2fd99c1f9da1e9f1bc491861ea466dcaadb96", path = "modules/ui_scene", package = "graphics-ui-scene" }
vector = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "8ee2fd99c1f9da1e9f1bc491861ea466dcaadb96", path = "modules/vector", package = "graphics-vector" }
