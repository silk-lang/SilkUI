[package]
name = "ui-inspect"
description = "The inspector core for ui-tree: snapshots, queries and input for people, tests and agents"
version = "0.1.0"
kind = "library"
exports = ["lib", "query", "overlay", "view", "session", "synth"]

[dependencies]
ui_tree = { path = "../tree", package = "ui-tree" }
ui_protocol = { path = "../protocol", package = "ui-protocol" }
properties = { git = "https://github.com/silk-lang/lib-css.git", rev = "56c7d654640cf497778bbd8175ca01542a3615d4", path = "modules/properties", package = "css-properties" }
layout = { git = "https://github.com/silk-lang/lib-css.git", rev = "56c7d654640cf497778bbd8175ca01542a3615d4", path = "modules/layout", package = "css-layout" }
ui_scene = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "c0b6b26992a0abc9b9864ffb6af46e61b6af73b4", path = "modules/ui_scene", package = "graphics-ui-scene" }
vector = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "c0b6b26992a0abc9b9864ffb6af46e61b6af73b4", path = "modules/vector", package = "graphics-vector" }
