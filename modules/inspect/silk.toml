[package]
name = "ui-inspect"
description = "The inspector core for ui-tree: snapshots, queries and input for people, tests and agents"
version = "0.1.0"
kind = "library"
exports = ["lib", "query", "overlay", "view", "session", "synth"]

[dependencies]
ui_tree = { path = "../tree", package = "ui-tree" }
ui_protocol = { path = "../protocol", package = "ui-protocol" }
properties = { git = "https://github.com/silk-lang/lib-css.git", rev = "2bfeb616ae0e7eb566aad62481be7b42b206042d", path = "modules/properties", package = "css-properties" }
layout = { git = "https://github.com/silk-lang/lib-css.git", rev = "2bfeb616ae0e7eb566aad62481be7b42b206042d", path = "modules/layout", package = "css-layout" }
ui_scene = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "27fe1c042203204009a7d86abc72b3c02fbaaa96", path = "modules/ui_scene", package = "graphics-ui-scene" }
vector = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "27fe1c042203204009a7d86abc72b3c02fbaaa96", path = "modules/vector", package = "graphics-vector" }
