[package]
name = "silkui"
description = "The front door of Silk UI: an app definition, and the pipeline steps a project's tasks build and run it with"
version = "0.1.0"
silk-version = "0.1.0-dev.74+205aea3f5b2e"
kind = "library"
main = "app.silk"
exports = ["app", "pipeline"]

[dependencies]
ui_protocol = { git = "https://github.com/silk-lang/silkui.git", rev = "67a1985e6c215f5a38fff82c4aaa6f42ef2580ef", path = "modules/protocol", package = "ui-protocol" }
css_style = { git = "https://github.com/silk-lang/lib-css.git", rev = "cfa5357ddaf81a6a98e87670e963d413fb8f185b", path = "modules/style", package = "css-style" }
