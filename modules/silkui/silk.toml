[package]
name = "silkui"
description = "The front door of Silk UI: an app definition, and the pipeline steps a project's tasks build and run it with"
version = "0.1.0"
kind = "library"
main = "app.silk"
exports = ["app", "pipeline"]

[dependencies]
ui_protocol = { path = "../protocol", package = "ui-protocol" }
css_style = { git = "https://github.com/silk-lang/lib-css.git", rev = "c37a7d4a60c1ef4bf2062fe8c72c28f9b3f77459", path = "modules/style", package = "css-style" }
