[package]
name = "silkui"
description = "The front door of Silk UI: an app definition, and the pipeline steps a project's tasks build and run it with"
version = "0.1.0"
silk-version = "0.1.0-dev.74+205aea3f5b2e"
kind = "library"
main = "app.silk"
exports = ["app", "pipeline"]

[dependencies]
ui_protocol = { git = "https://github.com/silk-lang/silkui.git", rev = "d985678f7a43e9bdca05063e05b294fe0ff78488", path = "modules/protocol", package = "ui-protocol" }
css_style = { git = "https://github.com/silk-lang/lib-css.git", rev = "646f083a915cc116dcfd2b1d5377082caa87a156", path = "modules/style", package = "css-style" }
