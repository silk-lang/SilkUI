[package]
name = "silkui"
description = "The front door of Silk UI: an app definition, and the pipeline steps a project's tasks build and run it with"
version = "0.1.0"
silk-version = "0.1.0-dev.74+205aea3f5b2e"
kind = "library"
main = "app.silk"
exports = ["app", "pipeline"]

[dependencies]
ui_protocol = { git = "https://github.com/silk-lang/silkui.git", rev = "ea23d85eeea1cb928c1c92b60140f84088b161c9", path = "modules/protocol", package = "ui-protocol" }
css_style = { git = "https://github.com/silk-lang/lib-css.git", rev = "3673cc97bb5cae281d31a07cabe0f49336826297", path = "modules/style", package = "css-style" }
