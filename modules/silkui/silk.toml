[package]
name = "silkui"
description = "The front door of Silk UI: an app definition, and the pipeline steps a project's tasks build and run it with"
version = "0.1.0"
silk-version = "0.1.0-dev.74+205aea3f5b2e"
kind = "library"
main = "app.silk"
exports = ["app", "pipeline"]

[dependencies]
ui_protocol = { git = "https://github.com/silk-lang/silkui.git", rev = "7ce8c2fcb294c7a89a68b2f47a629286da572960", path = "modules/protocol", package = "ui-protocol" }
css_style = { git = "https://github.com/silk-lang/lib-css.git", rev = "0290e535704e488c1c253dd8aff87ac0e53df6b5", path = "modules/style", package = "css-style" }
