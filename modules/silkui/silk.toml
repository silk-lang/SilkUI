[package]
name = "silkui"
description = "The front door of Silk UI: an app definition, and the pipeline steps a project's tasks build and run it with"
version = "0.1.0"
silk-version = "0.1.0-dev.74+205aea3f5b2e"
kind = "library"
main = "app.silk"
exports = ["app", "pipeline"]

[dependencies]
ui_protocol = { git = "https://github.com/silk-lang/silkui.git", rev = "23a40885d2ae0b0e61f868d6ccbae496478ad4e6", path = "modules/protocol", package = "ui-protocol" }
css_style = { git = "https://github.com/silk-lang/lib-css.git", rev = "121c0702247aa754f2ef9b8046af6f1f9e7e728a", path = "modules/style", package = "css-style" }
