[package]
main = "tasks.silk"
name = "js-counter"
description = "A counter written in plain JavaScript, built and run by silkui: silk task dev, silk task build"
version = "0.1.0"
silk-version = "0.1.0-pipeline.1"

# The app is JavaScript, in web/. Silk only builds the tasks, which build and run the app.

[dependencies]
silkui = { path = "../..", package = "silkui" }
silkui_window = { path = "../../window", package = "silkui-window" }
silkui_window_node = { path = "../../window/node", package = "silkui-window-node" }
ui_tree = { path = "../../../tree", package = "ui-tree" }
ui_inspect_server = { path = "../../../inspect/server", package = "ui-inspect-server" }
silkjs = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "748705385e6d15a2fd1db02f546b873dbc015ef8", path = "modules/engine", package = "silkjs-engine" }
node_runtime = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "748705385e6d15a2fd1db02f546b873dbc015ef8", path = "modules/runtime", package = "silkjs-runtime" }
