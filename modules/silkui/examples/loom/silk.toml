version = "0.1.0"
silk-version = "0.1.0-dev.87+37fa5f8857de"
source = "silk"
kind = "library"
exports = ["app"]

[dependencies]
loom = { git = "https://github.com/silk-lang/loom.git", rev = "26ad3afebafa1e992ce2bfc9b7386c822f60cf3c", path = "modules/loom", package = "loom" }

silkui = { git = "https://github.com/silk-lang/silkui.git", rev = "39414ca94c830a7a2c6411b5af1a397350cc708e", path = "modules/silkui", package = "silkui" }
silkui_window_loom = { git = "https://github.com/silk-lang/loom.git", rev = "26ad3afebafa1e992ce2bfc9b7386c822f60cf3c", path = "modules/silkui/window", package = "silkui-window-loom" }
silkui_web_canvas = { git = "https://github.com/silk-lang/loom.git", rev = "26ad3afebafa1e992ce2bfc9b7386c822f60cf3c", path = "modules/silkui/web/canvas", package = "silkui-web-canvas" }
silkui_web_dom = { git = "https://github.com/silk-lang/loom.git", rev = "26ad3afebafa1e992ce2bfc9b7386c822f60cf3c", path = "modules/silkui/web/dom", package = "silkui-web-dom" }
