[package]
name = "loom-counter"
description = "A counter written in Loom, built and run by silkui: silk task dev, silk task build"
version = "0.1.0"
silk-version = "0.1.0-dev.90+43166993a300"
source = "silk"
kind = "library"
exports = ["app"]

[dependencies]
loom = { git = "https://github.com/silk-lang/loom.git", rev = "ce47e4f830a7e600b717474d07135755ce19c0fe", path = "modules/loom", package = "loom" }

silkui = { git = "https://github.com/silk-lang/silkui.git", rev = "2e1b6f8a67a8ceced7f735a037f37a83237b310f", path = "modules/silkui", package = "silkui" }
silkui_window_loom = { git = "https://github.com/silk-lang/loom.git", rev = "ce47e4f830a7e600b717474d07135755ce19c0fe", path = "modules/silkui/window", package = "silkui-window-loom" }
silkui_web_canvas = { git = "https://github.com/silk-lang/loom.git", rev = "ce47e4f830a7e600b717474d07135755ce19c0fe", path = "modules/silkui/web/canvas", package = "silkui-web-canvas" }
silkui_web_dom = { git = "https://github.com/silk-lang/loom.git", rev = "ce47e4f830a7e600b717474d07135755ce19c0fe", path = "modules/silkui/web/dom", package = "silkui-web-dom" }
