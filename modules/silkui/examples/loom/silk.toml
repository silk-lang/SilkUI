[package]
main = "app.silk"
name = "loom-counter"
description = "A counter written in Loom, built and run by silkui: silk task dev, silk task build"
version = "0.1.0"
silk-version = "0.1.0-dev.74+205aea3f5b2e"
kind = "library"
exports = ["app"]

[dependencies]
loom = { git = "https://github.com/silk-lang/loom.git", rev = "63b4d0bfb8b6ac485c1c95cd99eff06e6a6649eb", path = "modules/loom", package = "loom" }

silkui = { path = "../..", package = "silkui" }
silkui_window_loom = { git = "https://github.com/silk-lang/loom.git", rev = "63b4d0bfb8b6ac485c1c95cd99eff06e6a6649eb", path = "modules/silkui/window", package = "silkui-window-loom" }
silkui_web_canvas = { git = "https://github.com/silk-lang/loom.git", rev = "63b4d0bfb8b6ac485c1c95cd99eff06e6a6649eb", path = "modules/silkui/web/canvas", package = "silkui-web-canvas" }
silkui_web_dom = { git = "https://github.com/silk-lang/loom.git", rev = "63b4d0bfb8b6ac485c1c95cd99eff06e6a6649eb", path = "modules/silkui/web/dom", package = "silkui-web-dom" }
loom_dom = { git = "https://github.com/silk-lang/loom.git", rev = "63b4d0bfb8b6ac485c1c95cd99eff06e6a6649eb", path = "modules/loom/dom", package = "loom-dom" }
ui_tree_window = { path = "../../../tree/window", package = "ui-tree-window" }
platform_window = { git = "https://github.com/silk-lang/lib-native.git", rev = "b40277a5a58d7ddf679cff350e8ee0f02388ef3f", path = "modules/platform/window", package = "platform-window" }
webgpu = { git = "https://github.com/silk-lang/lib-native.git", rev = "b40277a5a58d7ddf679cff350e8ee0f02388ef3f", path = "modules/gpu/webgpu", package = "gpu-webgpu" }
ui_tree = { path = "../../../tree", package = "ui-tree" }
ui_inspect_server = { path = "../../../inspect/server", package = "ui-inspect-server" }
