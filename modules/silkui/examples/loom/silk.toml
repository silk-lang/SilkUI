platform_window = { git = "https://github.com/silk-lang/lib-native.git", rev = "1ed8541db96b65a03481908003f38fb9ca70393a", path = "modules/platform/window", package = "platform-window" }
webgpu = { git = "https://github.com/silk-lang/lib-native.git", rev = "ba018626769f673eef024abfe9c2bf1a6987d80e", path = "modules/gpu/webgpu", package = "gpu-webgpu" }
ui_tree = { git = "https://github.com/silk-lang/silkui.git", rev = "b1c0f84cbcc80cade0d0aeef207673417ad12807", path = "modules/tree", package = "ui-tree" }
ui_inspect_server = { git = "https://github.com/silk-lang/silkui.git", rev = "b1c0f84cbcc80cade0d0aeef207673417ad12807", path = "modules/inspect/server", package = "ui-inspect-server" }
