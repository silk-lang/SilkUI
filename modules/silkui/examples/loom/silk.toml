[package]
name = "loom-counter"
description = "A counter written in Loom, built and run by silkui: silk task dev, silk task build"
version = "0.1.0"
silk-version = "0.1.0-dev.74+205aea3f5b2e"
kind = "library"
main = "app.silk"
exports = ["app"]

[dependencies]
loom = { git = "https://github.com/silk-lang/loom.git", rev = "2485aaa48180869b9bcd1e626f647bb1f17a96f3", path = "modules/loom", package = "loom" }

[profiles.tasks]
main = "tasks.silk"

[profiles.tasks.dependencies]
silkui = { path = "../..", package = "silkui" }
