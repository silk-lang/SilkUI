version = "0.1.0"
silk-version = "0.1.0-dev.87+37fa5f8857de"
source = "silk"
kind = "library"
exports = ["app"]

[dependencies]
loom = { git = "https://github.com/silk-lang/loom.git", rev = "4e319d2dd6ef9864896146ae4a91d22e9bb409d7", path = "modules/loom", package = "loom" }

silkui = { git = "https://github.com/silk-lang/silkui.git", rev = "41cd59fa92b7674b4207c7cbf4b77d2b7ee3aba7", path = "modules/silkui", package = "silkui" }
