[package]
name = "loom-counter"
description = "A counter written in Loom, built and run by silkui: silk task dev, silk task build"
version = "0.1.0"
silk-version = "0.1.0-dev.74+205aea3f5b2e"
source = "silk"
kind = "library"
main = "app.silk"
exports = ["app"]

[dependencies]
loom = { git = "https://github.com/silk-lang/loom.git", rev = "70123adb6f8a90a538ac632c3b94473a6c04561f", path = "modules/loom", package = "loom" }

[profiles.tasks]
main = "tasks.silk"

[profiles.tasks.dependencies]
silkui = { path = "../..", package = "silkui" }
