[package]
main = "app.silk"
name = "loom-counter"
description = "A counter written in Loom, built and run by silkui: silk task dev, silk task build"
version = "0.1.0"
silk-version = "0.1.0-dev.87+37fa5f8857de"
source = "silk"
kind = "library"
exports = ["app"]

[dependencies]
loom = { git = "https://github.com/silk-lang/loom.git", rev = "6bf830fe9d7a8d0d02b2037801977430c5878c89", path = "modules/loom", package = "loom" }

silkui = { git = "https://github.com/silk-lang/silkui.git", rev = "a447f9d774dd92f225285dd337e97f03cb68c90f", path = "modules/silkui", package = "silkui" }
silkui_window_loom = { git = "https://github.com/silk-lang/loom.git", rev = "7d0e22cff4b79c108518943dc879b956bf6e28c8", path = "modules/silkui/window", package = "silkui-window-loom" }
silkui_web_canvas = { git = "https://github.com/silk-lang/loom.git", rev = "7d0e22cff4b79c108518943dc879b956bf6e28c8", path = "modules/silkui/web/canvas", package = "silkui-web-canvas" }
silkui_web_dom = { git = "https://github.com/silk-lang/loom.git", rev = "7d0e22cff4b79c108518943dc879b956bf6e28c8", path = "modules/silkui/web/dom", package = "silkui-web-dom" }
loom_dom = { git = "https://github.com/silk-lang/loom.git", rev = "7d0e22cff4b79c108518943dc879b956bf6e28c8", path = "modules/loom/dom", package = "loom-dom" }
