[package]
main = "app.silk"
name = "loom-counter"
description = "A counter written in Loom, built and run by silkui: silk task dev, silk task build"
version = "0.1.0"
silk-version = "0.1.0-pipeline.1"
kind = "library"
exports = ["app"]

[dependencies]
loom = { git = "https://github.com/silk-lang/loom.git", rev = "d12fd8ed4e8bfcce7dcc0a6b949546877fcf7314", path = "modules/loom", package = "loom" }

silkui = { git = "https://github.com/silk-lang/silkui.git", rev = "7a78ea4edcc994505e08e65e1014c9ea937ec22a", path = "modules/silkui", package = "silkui" }
silkui_window_loom = { git = "https://github.com/silk-lang/loom.git", rev = "d12fd8ed4e8bfcce7dcc0a6b949546877fcf7314", path = "modules/silkui/window", package = "silkui-window-loom" }
silkui_web_canvas = { git = "https://github.com/silk-lang/loom.git", rev = "d12fd8ed4e8bfcce7dcc0a6b949546877fcf7314", path = "modules/silkui/web/canvas", package = "silkui-web-canvas" }
silkui_web_dom = { git = "https://github.com/silk-lang/loom.git", rev = "d12fd8ed4e8bfcce7dcc0a6b949546877fcf7314", path = "modules/silkui/web/dom", package = "silkui-web-dom" }
loom_dom = { git = "https://github.com/silk-lang/loom.git", rev = "d12fd8ed4e8bfcce7dcc0a6b949546877fcf7314", path = "modules/loom/dom", package = "loom-dom" }
ui_tree_window = { git = "https://github.com/silk-lang/silkui.git", rev = "7a78ea4edcc994505e08e65e1014c9ea937ec22a", path = "modules/tree/window", package = "ui-tree-window" }
platform_window = { git = "https://github.com/silk-lang/lib-native.git", rev = "8b411d1f2e4848a6a93d5cf26b488cd52db64069", path = "modules/platform/window", package = "platform-window" }
webgpu = { git = "https://github.com/silk-lang/lib-native.git", rev = "8b411d1f2e4848a6a93d5cf26b488cd52db64069", path = "modules/gpu/webgpu", package = "gpu-webgpu" }
ui_tree = { git = "https://github.com/silk-lang/silkui.git", rev = "7a78ea4edcc994505e08e65e1014c9ea937ec22a", path = "modules/tree", package = "ui-tree" }
ui_inspect_server = { git = "https://github.com/silk-lang/silkui.git", rev = "7a78ea4edcc994505e08e65e1014c9ea937ec22a", path = "modules/inspect/server", package = "ui-inspect-server" }
