silkui_web_canvas = { git = "https://github.com/silk-lang/loom.git", rev = "4e319d2dd6ef9864896146ae4a91d22e9bb409d7", path = "modules/silkui/web/canvas", package = "silkui-web-canvas" }
silkui_web_dom = { git = "https://github.com/silk-lang/loom.git", rev = "4e319d2dd6ef9864896146ae4a91d22e9bb409d7", path = "modules/silkui/web/dom", package = "silkui-web-dom" }
