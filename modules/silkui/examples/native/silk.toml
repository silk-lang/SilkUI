[package]
name = "native-primes"
description = "A plain JavaScript app that calls Silk functions compiled into its host, built and run by silkui: silk task dev, silk task build"
version = "0.1.0"
silk-version = "0.1.0-dev.74+205aea3f5b2e"
source = "silk"
# The modules JavaScript imports (`import { … } from "../silk/math.silk"`): silkui compiles them
# into the host, so the package is a library and the tasks have their own profile.
kind = "library"
main = "math.silk"
exports = ["math"]

[profiles.tasks]
main = "tasks.silk"

[profiles.tasks.dependencies]
silkui = { path = "../..", package = "silkui" }
