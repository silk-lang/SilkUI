[package]
main = "tasks.silk"
name = "native-primes"
description = "A plain JavaScript app that calls Silk functions compiled into its host, built and run by silkui: silk task dev, silk task build"
version = "0.1.0"
silk-version = "0.1.0-dev.98+dc4d2328ed3a"
source = "silk"
# The modules JavaScript imports (`import { … } from "../silk/math.silk"`): silkui compiles them
# into the host.
exports = ["math"]

[dependencies]
silkui = { path = "../..", package = "silkui" }
silkui_window = { path = "../../window", package = "silkui-window" }
silkui_window_node = { path = "../../window/node", package = "silkui-window-node" }
ui_tree = { path = "../../../tree", package = "ui-tree" }
ui_inspect_server = { path = "../../../inspect/server", package = "ui-inspect-server" }
silkjs = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "f7f07787c9c612eaeb686d04afcdbd6749e8b7f7", path = "modules/engine", package = "silkjs-engine" }
node_runtime = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "f7f07787c9c612eaeb686d04afcdbd6749e8b7f7", path = "modules/runtime", package = "silkjs-runtime" }
