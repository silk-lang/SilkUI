[package]
main = "tasks.silk"
name = "foldkit-counter"
description = "A counter written with Foldkit, built and run by silkui: silk task dev, silk task build"
version = "0.1.0"
silk-version = "0.1.0-dev.86+c9d19330761b"

# The app is JavaScript, in web/. Silk only builds the tasks, which build and run the app.

[dependencies]
silkui = { path = "../..", package = "silkui" }
silkui_window = { path = "../../window", package = "silkui-window" }
silkui_window_node = { path = "../../window/node", package = "silkui-window-node" }
ui_tree = { path = "../../../tree", package = "ui-tree" }
ui_inspect_server = { path = "../../../inspect/server", package = "ui-inspect-server" }
silkjs = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "86cb0a1e01b0ea797ce4bd2087201891d756879f", path = "modules/engine", package = "silkjs-engine" }
node_runtime = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "86cb0a1e01b0ea797ce4bd2087201891d756879f", path = "modules/runtime", package = "silkjs-runtime" }
