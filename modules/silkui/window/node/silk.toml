[package]
name = "silkui-window-node"
description = "What the hosts silkui generates for a JavaScript app on the full SilkJS runtime in a window run"
version = "0.1.0"
silk-version = "0.1.0-dev.74+205aea3f5b2e"
kind = "library"
main = "node.silk"
exports = ["node"]

[dependencies]
silkui_window = { path = "..", package = "silkui-window" }
ui_js = { path = "../../../js", package = "ui-js" }
ui_js_node = { path = "../../../js/node", package = "ui-js-node" }
ui_tree = { path = "../../../tree", package = "ui-tree" }
ui_tree_window = { path = "../../../tree/window", package = "ui-tree-window" }
font_collection = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "9c2c5e579164b7f12bfa769cc5d08566ec140856", path = "modules/collection", package = "font-collection" }
silkjs = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "ec15a61ccfb6698a13197d0bbf4e50fcfa68b56d", path = "modules/engine", package = "silkjs-engine" }
node_runtime = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "ec15a61ccfb6698a13197d0bbf4e50fcfa68b56d", path = "modules/runtime", package = "silkjs-runtime" }
window = { git = "https://github.com/silk-lang/lib-native.git", rev = "539fa8621907ae31baac2e11dbf7a15f70ed8558", path = "modules/platform/window", package = "platform-window" }
webgpu = { git = "https://github.com/silk-lang/lib-native.git", rev = "7166a093a36a64be92125f428ed8db5daf211b5b", path = "modules/gpu/webgpu", package = "gpu-webgpu" }
atlas = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "7e3770cb41beaf709272548863f5b020f476765f", path = "modules/atlas", package = "graphics-atlas" }
vector = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "7e3770cb41beaf709272548863f5b020f476765f", path = "modules/vector", package = "graphics-vector" }
