[package]
name = "silkui-window-node"
description = "What the hosts silkui generates for a JavaScript app on the full SilkJS runtime in a window run"
version = "0.1.0"
kind = "library"
main = "node.silk"
exports = ["node"]

[dependencies]
silkui_window = { path = "..", package = "silkui-window" }
ui_js = { path = "../../../js", package = "ui-js" }
ui_js_node = { path = "../../../js/node", package = "ui-js-node" }
ui_tree = { path = "../../../tree", package = "ui-tree" }
ui_tree_window = { path = "../../../tree/window", package = "ui-tree-window" }
font_collection = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "ca7a2b41659275ce1b5aafdb846b89ac48061658", path = "modules/collection", package = "font-collection" }
silkjs = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "dd9756e7e7b04ddbe69f2e205dcb2799004b0c3d", path = "modules/engine", package = "silkjs-engine" }
node_runtime = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "dd9756e7e7b04ddbe69f2e205dcb2799004b0c3d", path = "modules/runtime", package = "silkjs-runtime" }
window = { git = "https://github.com/silk-lang/lib-native.git", rev = "3386d71470b7e45007396591ff231448e98f992f", path = "modules/platform/window", package = "platform-window" }
webgpu = { git = "https://github.com/silk-lang/lib-native.git", rev = "3386d71470b7e45007396591ff231448e98f992f", path = "modules/gpu/webgpu", package = "gpu-webgpu" }
atlas = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "07f1c411416638fe54956446bf5332608cdb90e7", path = "modules/atlas", package = "graphics-atlas" }
vector = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "07f1c411416638fe54956446bf5332608cdb90e7", path = "modules/vector", package = "graphics-vector" }
wasm = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "dd9756e7e7b04ddbe69f2e205dcb2799004b0c3d", path = "modules/runtime/wamr", package = "silkjs-runtime-wamr" }
database = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "dd9756e7e7b04ddbe69f2e205dcb2799004b0c3d", path = "modules/runtime/sqlite", package = "silkjs-runtime-sqlite" }
addons = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "dd9756e7e7b04ddbe69f2e205dcb2799004b0c3d", path = "modules/runtime/napi", package = "silkjs-runtime-napi" }
silkhttp = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "dd9756e7e7b04ddbe69f2e205dcb2799004b0c3d", path = "modules/runtime/silkhttp", package = "silkjs-runtime-silkhttp" }
silkcrypto = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "dd9756e7e7b04ddbe69f2e205dcb2799004b0c3d", path = "modules/runtime/silkcrypto", package = "silkjs-runtime-silkcrypto" }
silktls = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "dd9756e7e7b04ddbe69f2e205dcb2799004b0c3d", path = "modules/runtime/silktls", package = "silkjs-runtime-silktls" }
silkcompress = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "dd9756e7e7b04ddbe69f2e205dcb2799004b0c3d", path = "modules/runtime/silkcompress", package = "silkjs-runtime-silkcompress" }
