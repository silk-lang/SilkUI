[package]
name = "silkui-window-node"
description = "What the hosts silkui generates for a JavaScript app on the full SilkJS runtime in a window run"
version = "0.1.0"
silk-version = "0.1.0-dev.87+37fa5f8857de"
kind = "library"
main = "node.silk"
exports = ["node"]

[dependencies]
silkui_window = { path = "..", package = "silkui-window" }
ui_js = { path = "../../../js", package = "ui-js" }
ui_js_node = { path = "../../../js/node", package = "ui-js-node" }
ui_tree = { path = "../../../tree", package = "ui-tree" }
ui_tree_window = { path = "../../../tree/window", package = "ui-tree-window" }
font_collection = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "771a3a53bf9e370313419b0dbd8598c1b9495246", path = "modules/collection", package = "font-collection" }
silkjs = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "f33f8793086ad93a80154de1c58b7903140e4928", path = "modules/engine", package = "silkjs-engine" }
node_runtime = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "f33f8793086ad93a80154de1c58b7903140e4928", path = "modules/runtime", package = "silkjs-runtime" }
window = { git = "https://github.com/silk-lang/lib-native.git", rev = "c069c8583fd56d7a4b90217b9abee021a35eb6b3", path = "modules/platform/window", package = "platform-window" }
webgpu = { git = "https://github.com/silk-lang/lib-native.git", rev = "ba018626769f673eef024abfe9c2bf1a6987d80e", path = "modules/gpu/webgpu", package = "gpu-webgpu" }
atlas = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "5352021805b6515f069ee41fa6a52f4bf1ec8157", path = "modules/atlas", package = "graphics-atlas" }
vector = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "5352021805b6515f069ee41fa6a52f4bf1ec8157", path = "modules/vector", package = "graphics-vector" }
wasm = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "f33f8793086ad93a80154de1c58b7903140e4928", path = "modules/runtime/wamr", package = "silkjs-runtime-wamr" }
database = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "f33f8793086ad93a80154de1c58b7903140e4928", path = "modules/runtime/sqlite", package = "silkjs-runtime-sqlite" }
addons = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "f33f8793086ad93a80154de1c58b7903140e4928", path = "modules/runtime/napi", package = "silkjs-runtime-napi" }
silkhttp = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "f33f8793086ad93a80154de1c58b7903140e4928", path = "modules/runtime/silkhttp", package = "silkjs-runtime-silkhttp" }
silkcrypto = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "f33f8793086ad93a80154de1c58b7903140e4928", path = "modules/runtime/silkcrypto", package = "silkjs-runtime-silkcrypto" }
silktls = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "f33f8793086ad93a80154de1c58b7903140e4928", path = "modules/runtime/silktls", package = "silkjs-runtime-silktls" }
silkcompress = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "f33f8793086ad93a80154de1c58b7903140e4928", path = "modules/runtime/silkcompress", package = "silkjs-runtime-silkcompress" }
