[package]
name = "silkui-window-node"
description = "What the hosts silkui generates for a JavaScript app on the full SilkJS runtime in a window run"
version = "0.1.0"
kind = "library"
main = "node.silk"
exports = ["node"]

[dependencies]
silkui_window = { path = "..", package = "silkui-window" }
ui_js = { path = "../../../js", package = "ui-js" }
ui_js_node = { path = "../../../js/node", package = "ui-js-node" }
ui_tree = { path = "../../../tree", package = "ui-tree" }
ui_tree_window = { path = "../../../tree/window", package = "ui-tree-window" }
font_collection = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "e5e8ef289ca3fd2a98bcfa496499a85b51239f0f", path = "modules/collection", package = "font-collection" }
silkjs = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "b68d7cc64c12aad3a369eb68978a939e5590d3cd", path = "modules/engine", package = "silkjs-engine" }
node_runtime = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "b68d7cc64c12aad3a369eb68978a939e5590d3cd", path = "modules/runtime", package = "silkjs-runtime" }
window = { git = "https://github.com/silk-lang/lib-native.git", rev = "597a202c86846ddf86b2791611dd6e7f50dd3deb", path = "modules/platform/window", package = "platform-window" }
webgpu = { git = "https://github.com/silk-lang/lib-native.git", rev = "597a202c86846ddf86b2791611dd6e7f50dd3deb", path = "modules/gpu/webgpu", package = "gpu-webgpu" }
atlas = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "a4cc4a88efdcc88d9e0f14ad62710f71c0069c8c", path = "modules/atlas", package = "graphics-atlas" }
vector = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "a4cc4a88efdcc88d9e0f14ad62710f71c0069c8c", path = "modules/vector", package = "graphics-vector" }
wasm = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "b68d7cc64c12aad3a369eb68978a939e5590d3cd", path = "modules/runtime/wamr", package = "silkjs-runtime-wamr" }
database = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "b68d7cc64c12aad3a369eb68978a939e5590d3cd", path = "modules/runtime/sqlite", package = "silkjs-runtime-sqlite" }
addons = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "b68d7cc64c12aad3a369eb68978a939e5590d3cd", path = "modules/runtime/napi", package = "silkjs-runtime-napi" }
silkhttp = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "b68d7cc64c12aad3a369eb68978a939e5590d3cd", path = "modules/runtime/silkhttp", package = "silkjs-runtime-silkhttp" }
silkcrypto = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "b68d7cc64c12aad3a369eb68978a939e5590d3cd", path = "modules/runtime/silkcrypto", package = "silkjs-runtime-silkcrypto" }
silktls = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "b68d7cc64c12aad3a369eb68978a939e5590d3cd", path = "modules/runtime/silktls", package = "silkjs-runtime-silktls" }
silkcompress = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "b68d7cc64c12aad3a369eb68978a939e5590d3cd", path = "modules/runtime/silkcompress", package = "silkjs-runtime-silkcompress" }
