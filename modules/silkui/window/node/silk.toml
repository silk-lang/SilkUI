[package]
name = "silkui-window-node"
description = "What the hosts silkui generates for a JavaScript app on the full SilkJS runtime in a window run"
version = "0.1.0"
silk-version = "0.1.0-dev.87+37fa5f8857de"
kind = "library"
main = "node.silk"
exports = ["node"]

[dependencies]
silkui_window = { path = "..", package = "silkui-window" }
ui_js = { path = "../../../js", package = "ui-js" }
ui_js_node = { path = "../../../js/node", package = "ui-js-node" }
ui_tree = { path = "../../../tree", package = "ui-tree" }
ui_tree_window = { path = "../../../tree/window", package = "ui-tree-window" }
font_collection = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "8223f309d714185cb36324373e8990237f744d52", path = "modules/collection", package = "font-collection" }
silkjs = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "f667845dc5f069caa425f6d1162ce02bc62fb40f", path = "modules/engine", package = "silkjs-engine" }
node_runtime = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "f667845dc5f069caa425f6d1162ce02bc62fb40f", path = "modules/runtime", package = "silkjs-runtime" }
window = { git = "https://github.com/silk-lang/lib-native.git", rev = "c069c8583fd56d7a4b90217b9abee021a35eb6b3", path = "modules/platform/window", package = "platform-window" }
webgpu = { git = "https://github.com/silk-lang/lib-native.git", rev = "ba018626769f673eef024abfe9c2bf1a6987d80e", path = "modules/gpu/webgpu", package = "gpu-webgpu" }
atlas = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "7b5b880008afdccec630e8afe3c234a9b670ae79", path = "modules/atlas", package = "graphics-atlas" }
vector = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "7b5b880008afdccec630e8afe3c234a9b670ae79", path = "modules/vector", package = "graphics-vector" }
wasm = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "f667845dc5f069caa425f6d1162ce02bc62fb40f", path = "modules/runtime/wamr", package = "silkjs-runtime-wamr" }
compress = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "f667845dc5f069caa425f6d1162ce02bc62fb40f", path = "modules/runtime/compress", package = "silkjs-runtime-compress" }
http2 = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "f667845dc5f069caa425f6d1162ce02bc62fb40f", path = "modules/runtime/http2", package = "silkjs-runtime-nghttp2" }
http = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "f667845dc5f069caa425f6d1162ce02bc62fb40f", path = "modules/runtime/llhttp", package = "silkjs-runtime-llhttp" }
database = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "f667845dc5f069caa425f6d1162ce02bc62fb40f", path = "modules/runtime/sqlite", package = "silkjs-runtime-sqlite" }
openssl = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "f667845dc5f069caa425f6d1162ce02bc62fb40f", path = "modules/runtime/openssl", package = "silkjs-runtime-openssl" }
inspector = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "f667845dc5f069caa425f6d1162ce02bc62fb40f", path = "modules/runtime/inspector", package = "silkjs-runtime-inspector" }
amaro = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "f667845dc5f069caa425f6d1162ce02bc62fb40f", path = "modules/runtime/amaro", package = "silkjs-runtime-amaro" }
addons = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "f667845dc5f069caa425f6d1162ce02bc62fb40f", path = "modules/runtime/napi", package = "silkjs-runtime-napi" }
