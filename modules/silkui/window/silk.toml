[package]
name = "silkui-window"
description = "What the hosts silkui generates for the window target run: a JavaScript app on the SilkJS engine"
version = "0.1.0"
silk-version = "0.1.0-dev.74+205aea3f5b2e"
kind = "library"
main = "js.silk"
exports = ["js", "js_dev"]

[dependencies]
ui_js = { path = "../../js", package = "ui-js" }
ui_js_window = { path = "../../js/window", package = "ui-js-window" }
ui_js_window_dev = { path = "../../js/window/dev", package = "ui-js-window-dev" }
ui_tree = { path = "../../tree", package = "ui-tree" }
ui_tree_window = { path = "../../tree/window", package = "ui-tree-window" }
ui_inspect_server = { path = "../../inspect/server", package = "ui-inspect-server" }
font_collection = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "9e4ce7377e2b07fa09c8523ca6047eb138f78754", path = "modules/collection", package = "font-collection" }
silkjs = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "ec15a61ccfb6698a13197d0bbf4e50fcfa68b56d", path = "modules/engine", package = "silkjs-engine" }
window = { git = "https://github.com/silk-lang/lib-native.git", rev = "04fe86e8c27014dd53fa43834707b044a502b167", path = "modules/platform/window", package = "platform-window" }
webgpu = { git = "https://github.com/silk-lang/lib-native.git", rev = "7166a093a36a64be92125f428ed8db5daf211b5b", path = "modules/gpu/webgpu", package = "gpu-webgpu" }
atlas = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "b5d64cf9d225f57378e716b13ce4fda892b37daf", path = "modules/atlas", package = "graphics-atlas" }
vector = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "b5d64cf9d225f57378e716b13ce4fda892b37daf", path = "modules/vector", package = "graphics-vector" }
