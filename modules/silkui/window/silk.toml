[package]
name = "silkui-window"
description = "What the hosts silkui generates for the window target run: a JavaScript app on the SilkJS engine"
version = "0.1.0"
kind = "library"
main = "js.silk"
exports = ["js", "js_dev", "natives", "image"]

[dependencies]
ui_js = { path = "../../js", package = "ui-js" }
ui_js_calls = { path = "../../js/calls", package = "ui-js-calls" }
ui_js_window = { path = "../../js/window", package = "ui-js-window" }
ui_js_window_dev = { path = "../../js/window/dev", package = "ui-js-window-dev" }
ui_tree = { path = "../../tree", package = "ui-tree" }
ui_tree_window = { path = "../../tree/window", package = "ui-tree-window" }
ui_inspect_server = { path = "../../inspect/server", package = "ui-inspect-server" }
font_collection = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "e23e91b449ccf202bb448267d566998f5a002c89", path = "modules/collection", package = "font-collection" }
silkjs = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "529054c8cc5f2bea519663fb89ee71305fd05e6f", path = "modules/engine", package = "silkjs-engine" }
window = { git = "https://github.com/silk-lang/lib-native.git", rev = "ae5ebb4e9ba32fd7c74b96293b9e5d8bcd7deabc", path = "modules/platform/window", package = "platform-window" }
webgpu = { git = "https://github.com/silk-lang/lib-native.git", rev = "ae5ebb4e9ba32fd7c74b96293b9e5d8bcd7deabc", path = "modules/gpu/webgpu", package = "gpu-webgpu" }
atlas = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "8ee2fd99c1f9da1e9f1bc491861ea466dcaadb96", path = "modules/atlas", package = "graphics-atlas" }
vector = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "8ee2fd99c1f9da1e9f1bc491861ea466dcaadb96", path = "modules/vector", package = "graphics-vector" }
