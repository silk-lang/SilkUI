[package]
name = "ui-protocol"
description = "The plain data a UI tree and its client exchange: mutations, input, event records, node ids, and the propagation walk"
version = "0.1.0"
kind = "library"
exports = ["stylesheet", "lib", "backend", "error", "input", "record", "request", "id", "event", "mutation", "rich", "aria", "batch", "css", "grid", "options", "root", "style_bundle"]

[dependencies]
layout = { git = "https://github.com/silk-lang/lib-css.git", rev = "484d7ae5ffb9f25d194f8aadacee0528b296ca3d", path = "modules/layout", package = "css-layout" }
properties = { git = "https://github.com/silk-lang/lib-css.git", rev = "484d7ae5ffb9f25d194f8aadacee0528b296ca3d", path = "modules/properties", package = "css-properties" }
codec = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "a4cc4a88efdcc88d9e0f14ad62710f71c0069c8c", path = "modules/codec", package = "graphics-codec" }
style = { git = "https://github.com/silk-lang/lib-css.git", rev = "484d7ae5ffb9f25d194f8aadacee0528b296ca3d", path = "modules/style", package = "css-style" }
