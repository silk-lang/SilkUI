[package]
name = "ui-protocol"
description = "The plain data a UI tree and its client exchange: mutations, input, event records, node ids, and the propagation walk"
version = "0.1.0"
silk-version = "0.1.0-dev.74+205aea3f5b2e"
kind = "library"
exports = ["stylesheet", "lib", "backend", "error", "input", "record", "request", "id", "event", "mutation", "rich", "aria", "batch", "css", "grid", "options", "root", "style_bundle"]

[dependencies]
layout = { git = "https://github.com/silk-lang/lib-css.git", rev = "4462832df85bc0de5bb3f6fd5666f316768dabbd", path = "modules/layout", package = "css-layout" }
properties = { git = "https://github.com/silk-lang/lib-css.git", rev = "4462832df85bc0de5bb3f6fd5666f316768dabbd", path = "modules/properties", package = "css-properties" }
codec = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "3090034b96c928208ee4b4875b06e46987e52125", path = "modules/codec", package = "graphics-codec" }
style = { git = "https://github.com/silk-lang/lib-css.git", rev = "4462832df85bc0de5bb3f6fd5666f316768dabbd", path = "modules/style", package = "css-style" }
