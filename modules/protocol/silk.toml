properties = { git = "https://github.com/silk-lang/lib-css.git", rev = "5ba29b06dcbbedc8d9f3f43605be97ec6c65f7b5", path = "modules/properties", package = "css-properties" }
codec = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "b5d64cf9d225f57378e716b13ce4fda892b37daf", path = "modules/codec", package = "graphics-codec" }
style = { git = "https://github.com/silk-lang/lib-css.git", rev = "5ba29b06dcbbedc8d9f3f43605be97ec6c65f7b5", path = "modules/style", package = "css-style" }
