[package]
name = "ui-protocol"
description = "The plain data a UI tree and its client exchange: mutations, input, event records, node ids, and the propagation walk"
version = "0.1.0"
silk-version = "0.1.0-dev.74+205aea3f5b2e"
kind = "library"
exports = ["stylesheet", "lib", "backend", "error", "input", "record", "request", "id", "event", "mutation", "rich", "aria", "batch", "css", "grid", "options", "root", "style_bundle"]

[dependencies]
layout = { git = "https://github.com/silk-lang/lib-css.git", rev = "a8b1c8f85f0d601a70c18af66169aea06e00b4c0", path = "modules/layout", package = "css-layout" }
properties = { git = "https://github.com/silk-lang/lib-css.git", rev = "a8b1c8f85f0d601a70c18af66169aea06e00b4c0", path = "modules/properties", package = "css-properties" }
codec = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "2cf97d2d406b76b39d0d1a13e871c88ad190d314", path = "modules/codec", package = "graphics-codec" }
style = { git = "https://github.com/silk-lang/lib-css.git", rev = "a8b1c8f85f0d601a70c18af66169aea06e00b4c0", path = "modules/style", package = "css-style" }
