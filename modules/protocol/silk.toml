[package]
name = "ui-protocol"
description = "The plain data a UI tree and its client exchange: mutations, input, event records, node ids, and the propagation walk"
version = "0.1.0"
kind = "library"
exports = ["animatable", "stylesheet", "lib", "backend", "error", "input", "record", "request", "id", "event", "mutation", "rich", "aria", "batch", "css", "grid", "options", "root", "style_bundle"]

[dependencies]
layout = { git = "https://github.com/silk-lang/lib-css.git", rev = "00aa41046e170fbaa4bce6063956adecadd373f3", path = "modules/layout", package = "css-layout" }
properties = { git = "https://github.com/silk-lang/lib-css.git", rev = "00aa41046e170fbaa4bce6063956adecadd373f3", path = "modules/properties", package = "css-properties" }
codec = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "599e1f1c800843069678610db7a17f764a41b3d5", path = "modules/codec", package = "graphics-codec" }
style = { git = "https://github.com/silk-lang/lib-css.git", rev = "00aa41046e170fbaa4bce6063956adecadd373f3", path = "modules/style", package = "css-style" }
