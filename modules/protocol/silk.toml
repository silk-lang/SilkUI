[package]
name = "ui-protocol"
description = "The plain data a UI tree and its client exchange: mutations, input, event records, node ids, and the propagation walk"
version = "0.1.0"
silk-version = "0.1.0-dev.86+c9d19330761b"
kind = "library"
exports = ["stylesheet", "lib", "backend", "error", "input", "record", "request", "id", "event", "mutation", "rich", "aria", "batch", "css", "grid", "options", "root", "style_bundle"]

[dependencies]
layout = { git = "https://github.com/silk-lang/lib-css.git", rev = "95fbcb38f873324ce47cae9b67459df4086205e3", path = "modules/layout", package = "css-layout" }
properties = { git = "https://github.com/silk-lang/lib-css.git", rev = "95fbcb38f873324ce47cae9b67459df4086205e3", path = "modules/properties", package = "css-properties" }
codec = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "623bd4fadafea52371b90277bfc171c417984c4d", path = "modules/codec", package = "graphics-codec" }
style = { git = "https://github.com/silk-lang/lib-css.git", rev = "95fbcb38f873324ce47cae9b67459df4086205e3", path = "modules/style", package = "css-style" }
