[package]
name = "ui-js-web-app"
description = "The wasm program behind every ui-js application on web-canvas: the UI tree, its renderer and fonts, and the client that runs the page's JavaScript application"
version = "0.1.0"
silk-version = "0.1.0-dev.74+205aea3f5b2e"

[dependencies]
ui_js_calls = { path = "../../calls", package = "ui-js-calls" }
ui_js_web = { path = "..", package = "ui-js-web" }
ui_tree = { path = "../../../tree", package = "ui-tree" }
ui_tree_window = { path = "../../../tree/window", package = "ui-tree-window" }
ui_fixtures = { path = "../../../tree/fixtures", package = "ui-tree-fixtures" }
ui_inspect_server = { path = "../../../inspect/server", package = "ui-inspect-server" }
window = { git = "https://github.com/silk-lang/lib-native.git", rev = "030768421cb0b12c4a4ce5761040f92c82796e80", path = "modules/platform/window", package = "platform-window" }
webgpu = { git = "https://github.com/silk-lang/lib-native.git", rev = "7166a093a36a64be92125f428ed8db5daf211b5b", path = "modules/gpu/webgpu", package = "gpu-webgpu" }
webgpu_sys = { git = "https://github.com/silk-lang/lib-native.git", rev = "7166a093a36a64be92125f428ed8db5daf211b5b", path = "modules/gpu/webgpu/sys", package = "gpu-webgpu-sys" }
atlas = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "3090034b96c928208ee4b4875b06e46987e52125", path = "modules/atlas", package = "graphics-atlas" }
vector = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "3090034b96c928208ee4b4875b06e46987e52125", path = "modules/vector", package = "graphics-vector" }
