[package]
name = "ui-js-web"
description = "Runs a ui-js application on the browser's own JavaScript engine against a wasm build of the UI tree: the window client and the wire the page's __ui writes"
version = "0.1.0"
silk-version = "0.1.0-dev.87+37fa5f8857de"
kind = "library"
exports = ["lib", "wire"]

[dependencies]
ui_tree = { path = "../../tree", package = "ui-tree" }
ui_tree_window = { path = "../../tree/window", package = "ui-tree-window" }
ui_js_calls = { path = "../calls", package = "ui-js-calls" }
window = { git = "https://github.com/silk-lang/lib-native.git", rev = "f60878a45add95ae71362f815863f444d2985c07", path = "modules/platform/window", package = "platform-window" }
webgpu = { git = "https://github.com/silk-lang/lib-native.git", rev = "ba018626769f673eef024abfe9c2bf1a6987d80e", path = "modules/gpu/webgpu", package = "gpu-webgpu" }
