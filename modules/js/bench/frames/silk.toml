[package]
name = "ui-js-bench-frames"
description = "Times the animation frames of a ui-js application on the embedded engine and the tree, without a window or a GPU"
version = "0.1.0"

[dependencies]
ui_js = { path = "../..", package = "ui-js" }
ui_tree = { path = "../../../tree", package = "ui-tree" }
ui_fixtures = { path = "../../../tree/fixtures", package = "ui-tree-fixtures" }
silkjs = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "7ad4a212578f64d8e95a894cb12b1a2f841f36c7", path = "modules/engine", package = "silkjs-engine" }
