[package]
name = "ui-js-gpu"
description = "Runs the WebGPU commands of a ui-js realm on a GPU device of the application's own, and shows what it drew in canvas nodes"
version = "0.1.0"
kind = "library"
exports = ["wire", "service"]

[dependencies]
ui_tree = { path = "../../tree", package = "ui-tree" }
ui_tree_window = { path = "../../tree/window", package = "ui-tree-window" }
ui_js_calls = { path = "../calls", package = "ui-js-calls" }
webgpu = { git = "https://github.com/silk-lang/lib-native.git", rev = "5d7ebcd86e161465fdd71e6f979c2f49a3bd07a3", path = "modules/gpu/webgpu", package = "gpu-webgpu" }
webgpu_sys = { git = "https://github.com/silk-lang/lib-native.git", rev = "5d7ebcd86e161465fdd71e6f979c2f49a3bd07a3", path = "modules/gpu/webgpu/sys", package = "gpu-webgpu-sys" }
