[package]
name = "ui-js-window"
description = "Runs a ui-js application in a platform window: its timers, animation frames and console on the window host's loop"
version = "0.1.0"
silk-version = "0.1.0-pipeline.1"
kind = "library"
exports = ["lib", "opener", "shell"]

[dependencies]
ui_js = { path = "..", package = "ui-js" }
ui_tree = { path = "../../tree", package = "ui-tree" }
ui_tree_window = { path = "../../tree/window", package = "ui-tree-window" }
silkjs = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "ce6380982e36f751fe640590d4c40210a148fffb", path = "modules/engine", package = "silkjs-engine" }
window = { git = "https://github.com/silk-lang/lib-native.git", rev = "56384899c345b81471ecbb4ae9f9dd79cb8358f7", path = "modules/platform/window", package = "platform-window" }
