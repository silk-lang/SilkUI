[package]
name = "ui-js-window"
description = "Runs a ui-js application in a platform window: its timers, animation frames and console on the window host's loop"
version = "0.1.0"
kind = "library"
exports = ["lib", "natives", "opener", "shell"]

[dependencies]
ui_js = { path = "..", package = "ui-js" }
ui_js_gpu = { path = "../gpu", package = "ui-js-gpu" }
ui_js_calls = { path = "../calls", package = "ui-js-calls" }
ui_tree = { path = "../../tree", package = "ui-tree" }
ui_tree_window = { path = "../../tree/window", package = "ui-tree-window" }
silkjs = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "33608cc5dc56658347e56f855cb110726363a0cd", path = "modules/engine", package = "silkjs-engine" }
window = { git = "https://github.com/silk-lang/lib-native.git", rev = "5d7ebcd86e161465fdd71e6f979c2f49a3bd07a3", path = "modules/platform/window", package = "platform-window" }
