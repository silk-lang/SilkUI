[package]
name = "ui-js-window"
description = "Runs a ui-js application in a platform window: its timers, animation frames and console on the window host's loop"
version = "0.1.0"
silk-version = "0.1.0-dev.74+205aea3f5b2e"
kind = "library"
exports = ["lib", "natives", "opener", "shell"]

[dependencies]
ui_js = { path = "..", package = "ui-js" }
ui_tree = { path = "../../tree", package = "ui-tree" }
ui_tree_window = { path = "../../tree/window", package = "ui-tree-window" }
silkjs = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "ec15a61ccfb6698a13197d0bbf4e50fcfa68b56d", path = "modules/engine", package = "silkjs-engine" }
window = { git = "https://github.com/silk-lang/lib-native.git", rev = "821b601e427f83ac27cd2a6081d40c3c417fa832", path = "modules/platform/window", package = "platform-window" }
