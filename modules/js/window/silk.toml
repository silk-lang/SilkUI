[package]
name = "ui-js-window"
description = "Runs a ui-js application in a platform window: its timers, animation frames and console on the window host's loop"
version = "0.1.0"
silk-version = "0.1.0-dev.87+37fa5f8857de"
kind = "library"
exports = ["lib", "natives", "opener", "shell"]

[dependencies]
ui_js = { path = "..", package = "ui-js" }
ui_tree = { path = "../../tree", package = "ui-tree" }
ui_tree_window = { path = "../../tree/window", package = "ui-tree-window" }
silkjs = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "7b404f3365041073b47ca35c98d6abb6d6d69e29", path = "modules/engine", package = "silkjs-engine" }
window = { git = "https://github.com/silk-lang/lib-native.git", rev = "c069c8583fd56d7a4b90217b9abee021a35eb6b3", path = "modules/platform/window", package = "platform-window" }
