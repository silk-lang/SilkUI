[package]
name = "ui-js-window"
description = "Runs a ui-js application in a platform window: its timers, animation frames and console on the window host's loop"
version = "0.1.0"
silk-version = "0.1.0-dev.87+37fa5f8857de"
kind = "library"
exports = ["lib", "natives", "opener", "shell"]

[dependencies]
ui_js = { path = "..", package = "ui-js" }
ui_tree = { path = "../../tree", package = "ui-tree" }
ui_tree_window = { path = "../../tree/window", package = "ui-tree-window" }
silkjs = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "b36150f3597d599f0693b73b4617cdeaaebe8e70", path = "modules/engine", package = "silkjs-engine" }
window = { git = "https://github.com/silk-lang/lib-native.git", rev = "ba018626769f673eef024abfe9c2bf1a6987d80e", path = "modules/platform/window", package = "platform-window" }
