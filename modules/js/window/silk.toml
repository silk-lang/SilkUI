[package]
name = "ui-js-window"
description = "Runs a ui-js application in a platform window: its timers, animation frames and console on the window host's loop"
version = "0.1.0"
kind = "library"
exports = ["lib", "natives", "opener", "shell"]

[dependencies]
ui_js = { path = "..", package = "ui-js" }
ui_js_gpu = { path = "../gpu", package = "ui-js-gpu" }
ui_js_calls = { path = "../calls", package = "ui-js-calls" }
ui_tree = { path = "../../tree", package = "ui-tree" }
ui_tree_window = { path = "../../tree/window", package = "ui-tree-window" }
silkjs = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "dd9756e7e7b04ddbe69f2e205dcb2799004b0c3d", path = "modules/engine", package = "silkjs-engine" }
webview = { path = "../../webview", package = "ui-webview" }
window = { git = "https://github.com/silk-lang/lib-native.git", rev = "3386d71470b7e45007396591ff231448e98f992f", path = "modules/platform/window", package = "platform-window" }
