[package]
name = "ui-js-window-dev"
description = "Development tools for a ui-js window: reload on a new build, and run the application from the @silkui/vite development server with hot module replacement"
version = "0.1.0"
kind = "library"
exports = ["lib"]

[dependencies]
ui_js = { path = "../..", package = "ui-js" }
ui_js_window = { path = "..", package = "ui-js-window" }
ui_tree = { path = "../../../tree", package = "ui-tree" }
ui_tree_window = { path = "../../../tree/window", package = "ui-tree-window" }
ui_inspect_server = { path = "../../../inspect/server", package = "ui-inspect-server" }
silkjs = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "9c61bea2c4706e5404305d372162a1a5e0e96ea2", path = "modules/engine", package = "silkjs-engine" }
