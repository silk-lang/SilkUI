[package]
name = "ui-js-calls"
description = "What the __ui functions of a ui-js host do with their arguments, apart from any JavaScript engine: shared by the embedded engine's bridge and the browser's"
version = "0.1.0"
kind = "library"
exports = ["lib", "gpu", "markdown", "natives", "stylesheets", "stylesheet_compiler", "supports"]

[dependencies]
ui_tree = { path = "../../tree", package = "ui-tree" }
css_style = { git = "https://github.com/silk-lang/lib-css.git", rev = "d2ca2fd1dc607a505f25490eecee5142fe4c6eaf", path = "modules/style", package = "css-style" }

properties = { git = "https://github.com/silk-lang/lib-css.git", rev = "d2ca2fd1dc607a505f25490eecee5142fe4c6eaf", path = "modules/properties", package = "css-properties" }
