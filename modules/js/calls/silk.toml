[package]
name = "ui-js-calls"
description = "What the __ui functions of a ui-js host do with their arguments, apart from any JavaScript engine: shared by the embedded engine's bridge and the browser's"
version = "0.1.0"
silk-version = "0.1.0-dev.87+37fa5f8857de"
kind = "library"
exports = ["lib", "markdown", "natives", "stylesheets", "stylesheet_compiler"]

[dependencies]
ui_tree = { path = "../../tree", package = "ui-tree" }
css_style = { git = "https://github.com/silk-lang/lib-css.git", rev = "f62c965030d5daba6f7927438fe673dbab552db9", path = "modules/style", package = "css-style" }

properties = { git = "https://github.com/silk-lang/lib-css.git", rev = "f62c965030d5daba6f7927438fe673dbab552db9", path = "modules/properties", package = "css-properties" }
