[package]
name = "ui-js"
description = "Runs a JavaScript application on a UI tree with the SilkJS engine embedded: nodes through ui-protocol batches, events delivered synchronously"
version = "0.1.0"
silk-version = "0.1.0-dev.74+205aea3f5b2e"
kind = "library"
exports = ["lib", "host", "bridge"]

[dependencies]
ui_tree = { path = "../tree", package = "ui-tree" }
css_style = { git = "https://github.com/silk-lang/lib-css.git", rev = "2abb0f43d03c40221a8082a8071cd700a5cc7161", path = "modules/style", package = "css-style" }
silkjs = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "64772fffcb79cb6b4ff087f4cbc19f24db44bb3c", path = "modules/engine", package = "silkjs" }
