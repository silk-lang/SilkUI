[package]
name = "ui-js"
description = "Runs a JavaScript application on a UI tree with the SilkJS engine embedded: nodes through ui-protocol batches, events delivered synchronously"
version = "0.1.0"
kind = "library"
exports = ["lib", "host", "bridge"]

[dependencies]
ui_tree = { path = "../tree", package = "ui-tree" }
ui_js_calls = { path = "calls", package = "ui-js-calls" }
svg_css = { git = "https://github.com/silk-lang/lib-css.git", rev = "a99f4d1ee666a2732b99d3cb51dae051e2bb1f0b", path = "modules/style", package = "css-style" }
silkjs = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "94a5dd6ae1b37f2c45088e2fe376bebfa3e742ea", path = "modules/engine", package = "silkjs-engine" }
