[package]
name = "ui-js"
description = "Runs a JavaScript application on a UI tree with the SilkJS engine embedded: nodes through ui-protocol batches, events delivered synchronously"
version = "0.1.0"
kind = "library"
exports = ["lib", "host", "bridge"]

[dependencies]
ui_tree = { path = "../tree", package = "ui-tree" }
ui_js_calls = { path = "calls", package = "ui-js-calls" }
svg_css = { git = "https://github.com/silk-lang/lib-css.git", rev = "484d7ae5ffb9f25d194f8aadacee0528b296ca3d", path = "modules/style", package = "css-style" }
silkjs = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "e22021aa1d5035cbecd069fbb189fef622c0207f", path = "modules/engine", package = "silkjs-engine" }
