[package]
name = "ui-js"
description = "Runs a JavaScript application on a UI tree with the SilkJS engine embedded: nodes through ui-protocol batches, events delivered synchronously"
version = "0.1.0"
silk-version = "0.1.0-dev.87+37fa5f8857de"
kind = "library"
exports = ["lib", "host", "bridge"]

[dependencies]
ui_tree = { path = "../tree", package = "ui-tree" }
ui_js_calls = { path = "calls", package = "ui-js-calls" }
svg_css = { git = "https://github.com/silk-lang/lib-css.git", rev = "d1779652e46fde90a90fd418369f02ee6b37229e", path = "modules/style", package = "css-style" }
silkjs = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "f667845dc5f069caa425f6d1162ce02bc62fb40f", path = "modules/engine", package = "silkjs-engine" }
