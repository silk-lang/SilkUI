[package]
name = "ui-js"
description = "Runs a JavaScript application on a UI tree with the SilkJS engine embedded: nodes through ui-protocol batches, events delivered synchronously"
version = "0.1.0"
silk-version = "0.1.0-dev.87+37fa5f8857de"
kind = "library"
exports = ["lib", "host", "bridge"]

[dependencies]
ui_tree = { path = "../tree", package = "ui-tree" }
ui_js_calls = { path = "calls", package = "ui-js-calls" }
svg_css = { git = "https://github.com/silk-lang/lib-css.git", rev = "6496d0a9e91bf7b8e93a822338fc8ccfc1eed7c8", path = "modules/style", package = "css-style" }
silkjs = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "87da827f2fe06329dfde969da692a6c06ce7551f", path = "modules/engine", package = "silkjs-engine" }
