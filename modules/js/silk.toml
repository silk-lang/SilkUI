[package]
name = "ui-js"
description = "Runs a JavaScript application on a UI tree with the SilkJS engine embedded: nodes through ui-protocol batches, events delivered synchronously"
version = "0.1.0"
kind = "library"
exports = ["lib", "host", "bridge"]

[dependencies]
ui_tree = { path = "../tree", package = "ui-tree" }
ui_js_calls = { path = "calls", package = "ui-js-calls" }
codec = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "8ee2fd99c1f9da1e9f1bc491861ea466dcaadb96", path = "modules/codec", package = "graphics-codec" }
svg_css = { git = "https://github.com/silk-lang/lib-css.git", rev = "bc4b81d2b3b211db4cc37f40f5f1cc6721c47250", path = "modules/style", package = "css-style" }
silkjs = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "75633f9d76592a43d24ab9984890f5b956e6a4b2", path = "modules/engine", package = "silkjs-engine" }
