[package]
name = "ui-js"
description = "Runs a JavaScript application on a UI tree with the SilkJS engine embedded: nodes through ui-protocol batches, events delivered synchronously"
version = "0.1.0"
kind = "library"
exports = ["lib", "host", "bridge"]

[dependencies]
ui_tree = { path = "../tree", package = "ui-tree" }
ui_js_calls = { path = "calls", package = "ui-js-calls" }
codec = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "08ca82abc883aca7c1742b665a22453fb8995f50", path = "modules/codec", package = "graphics-codec" }
svg_css = { git = "https://github.com/silk-lang/lib-css.git", rev = "c4b6224569774005eae910f464dd763df74fae55", path = "modules/style", package = "css-style" }
silkjs = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "258e3fb55d59096d539a6186a833aec6b99e8b36", path = "modules/engine", package = "silkjs-engine" }
