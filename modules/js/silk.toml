[package]
name = "ui-js"
description = "Runs a JavaScript application on a UI tree with the SilkJS engine embedded: nodes through ui-protocol batches, events delivered synchronously"
version = "0.1.0"
kind = "library"
exports = ["lib", "host", "bridge"]

[dependencies]
ui_tree = { path = "../tree", package = "ui-tree" }
ui_js_calls = { path = "calls", package = "ui-js-calls" }
codec = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "c5fc48eb37e06b217ac96effa7801866e46f90ed", path = "modules/codec", package = "graphics-codec" }
svg_css = { git = "https://github.com/silk-lang/lib-css.git", rev = "a722eeeb6b41d0179235cb99d886b52321691f14", path = "modules/style", package = "css-style" }
silkjs = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "80b4ace6491259b56b3b49486b03b32674a235eb", path = "modules/engine", package = "silkjs-engine" }
