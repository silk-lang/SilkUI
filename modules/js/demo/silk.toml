[package]
name = "ui-js-demo"
version = "0.1.0"
silk-version = "0.1.0-dev.74+205aea3f5b2e"

[dependencies]
ui_js = { path = "..", package = "ui-js" }
ui_js_window = { path = "../window", package = "ui-js-window" }
ui_js_window_dev = { path = "../window/dev", package = "ui-js-window-dev" }
ui_tree = { path = "../../tree", package = "ui-tree" }
ui_tree_window = { path = "../../tree/window", package = "ui-tree-window" }
font_collection = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "7667e203b385ba0d0d704f88a9cd37b1859148a6", path = "modules/collection", package = "font-collection" }
ui_fixtures = { path = "../../tree/fixtures", package = "ui-tree-fixtures" }
ui_inspect_server = { path = "../../inspect/server", package = "ui-inspect-server" }
silkjs = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "5d29897709b0cf708b259eb80bd409ac1067cdda", path = "modules/engine", package = "silkjs-engine" }
window = { git = "https://github.com/silk-lang/lib-native.git", rev = "b40277a5a58d7ddf679cff350e8ee0f02388ef3f", path = "modules/platform/window", package = "platform-window" }
webgpu = { git = "https://github.com/silk-lang/lib-native.git", rev = "b40277a5a58d7ddf679cff350e8ee0f02388ef3f", path = "modules/gpu/webgpu", package = "gpu-webgpu" }
atlas = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "1ba6e77674b908b534db11b9654dd0e7539a8bac", path = "modules/atlas", package = "graphics-atlas" }
vector = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "1ba6e77674b908b534db11b9654dd0e7539a8bac", path = "modules/vector", package = "graphics-vector" }

# The development host, optimized: what to run JavaScript work on. The engine in a debug
# build is far slower (a frame of the starter page's motion takes 30 ms and more of
# JavaScript there, under 1 ms here), so animations stutter in it.
