[package]
name = "ui-js-demo"
version = "0.1.0"

[dependencies]
ui_js = { path = "..", package = "ui-js" }
ui_js_window = { path = "../window", package = "ui-js-window" }
ui_js_window_dev = { path = "../window/dev", package = "ui-js-window-dev" }
ui_tree = { path = "../../tree", package = "ui-tree" }
ui_tree_window = { path = "../../tree/window", package = "ui-tree-window" }
font_collection = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "66d81fc2655e420301030fc38f306e28f4172441", path = "modules/collection", package = "font-collection" }
ui_fixtures = { path = "../../tree/fixtures", package = "ui-tree-fixtures" }
ui_inspect_server = { path = "../../inspect/server", package = "ui-inspect-server" }
silkjs = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "80b4ace6491259b56b3b49486b03b32674a235eb", path = "modules/engine", package = "silkjs-engine" }
window = { git = "https://github.com/silk-lang/lib-native.git", rev = "3386d71470b7e45007396591ff231448e98f992f", path = "modules/platform/window", package = "platform-window" }
webgpu = { git = "https://github.com/silk-lang/lib-native.git", rev = "3386d71470b7e45007396591ff231448e98f992f", path = "modules/gpu/webgpu", package = "gpu-webgpu" }
atlas = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "08ca82abc883aca7c1742b665a22453fb8995f50", path = "modules/atlas", package = "graphics-atlas" }
vector = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "08ca82abc883aca7c1742b665a22453fb8995f50", path = "modules/vector", package = "graphics-vector" }

# The development host, optimized: what to run JavaScript work on. The engine in a debug
# build is far slower (a frame of the starter page's motion takes 30 ms and more of
# JavaScript there, under 1 ms here), so animations stutter in it.
