[package]
name = "ui-js-demo"
version = "0.1.0"
silk-version = "0.1.0-dev.86+c9d19330761b"

[dependencies]
ui_js = { path = "..", package = "ui-js" }
ui_js_window = { path = "../window", package = "ui-js-window" }
ui_js_window_dev = { path = "../window/dev", package = "ui-js-window-dev" }
ui_tree = { path = "../../tree", package = "ui-tree" }
ui_tree_window = { path = "../../tree/window", package = "ui-tree-window" }
font_collection = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "60232e77cebf1543aed919f72d68873b5f4b5af1", path = "modules/collection", package = "font-collection" }
ui_fixtures = { path = "../../tree/fixtures", package = "ui-tree-fixtures" }
ui_inspect_server = { path = "../../inspect/server", package = "ui-inspect-server" }
silkjs = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "e722c31aee4d9eec7876f24c9b4b825d480d5282", path = "modules/engine", package = "silkjs-engine" }
window = { git = "https://github.com/silk-lang/lib-native.git", rev = "c6239ef43f52ecfbd75a19b23719140fc1af02de", path = "modules/platform/window", package = "platform-window" }
webgpu = { git = "https://github.com/silk-lang/lib-native.git", rev = "c6239ef43f52ecfbd75a19b23719140fc1af02de", path = "modules/gpu/webgpu", package = "gpu-webgpu" }
atlas = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "623bd4fadafea52371b90277bfc171c417984c4d", path = "modules/atlas", package = "graphics-atlas" }
vector = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "623bd4fadafea52371b90277bfc171c417984c4d", path = "modules/vector", package = "graphics-vector" }

# The development host, optimized: what to run JavaScript work on. The engine in a debug
# build is far slower (a frame of the starter page's motion takes 30 ms and more of
# JavaScript there, under 1 ms here), so animations stutter in it.
