[package]
name = "ui-js-demo"
version = "0.1.0"
silk-version = "0.1.0-dev.74+205aea3f5b2e"

[dependencies]
ui_js = { path = "..", package = "ui-js" }
ui_js_window = { path = "../window", package = "ui-js-window" }
ui_js_window_dev = { path = "../window/dev", package = "ui-js-window-dev" }
ui_tree = { path = "../../tree", package = "ui-tree" }
ui_tree_window = { path = "../../tree/window", package = "ui-tree-window" }
font_collection = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "f186b9f6148d936ae3fee9fb9467f3124dbef942", path = "modules/collection", package = "font-collection" }
ui_fixtures = { path = "../../tree/fixtures", package = "ui-tree-fixtures" }
ui_inspect_server = { path = "../../inspect/server", package = "ui-inspect-server" }
silkjs = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "ec15a61ccfb6698a13197d0bbf4e50fcfa68b56d", path = "modules/engine", package = "silkjs-engine" }
window = { git = "https://github.com/silk-lang/lib-native.git", rev = "04fe86e8c27014dd53fa43834707b044a502b167", path = "modules/platform/window", package = "platform-window" }
webgpu = { git = "https://github.com/silk-lang/lib-native.git", rev = "7166a093a36a64be92125f428ed8db5daf211b5b", path = "modules/gpu/webgpu", package = "gpu-webgpu" }
atlas = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "62fbfe032c224bca5c679f8b6c2a33a2a5cf6b70", path = "modules/atlas", package = "graphics-atlas" }
vector = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "62fbfe032c224bca5c679f8b6c2a33a2a5cf6b70", path = "modules/vector", package = "graphics-vector" }

# The development host, optimized: what to run JavaScript work on. The engine in a debug
# build is far slower (a frame of the starter page's motion takes 30 ms and more of
# JavaScript there, under 1 ms here), so animations stutter in it.
[profiles.dev]
optimization = "speed"

# The host without its development tools: no reload, no development server, no inspector.
[profiles.production]
main = "production.silk"
optimization = "speed"
debug = false
