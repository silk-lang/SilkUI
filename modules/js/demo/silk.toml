[package]
name = "ui-js-demo"
version = "0.1.0"

[dependencies]
ui_js = { path = "..", package = "ui-js" }
ui_js_window = { path = "../window", package = "ui-js-window" }
ui_js_window_dev = { path = "../window/dev", package = "ui-js-window-dev" }
ui_tree = { path = "../../tree", package = "ui-tree" }
ui_tree_window = { path = "../../tree/window", package = "ui-tree-window" }
font_collection = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "8f79a1d913f8d1d7ba8f0ffed852bfb67fd0cd90", path = "modules/collection", package = "font-collection" }
ui_fixtures = { path = "../../tree/fixtures", package = "ui-tree-fixtures" }
ui_inspect_server = { path = "../../inspect/server", package = "ui-inspect-server" }
silkjs = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "f7f07787c9c612eaeb686d04afcdbd6749e8b7f7", path = "modules/engine", package = "silkjs-engine" }
window = { git = "https://github.com/silk-lang/lib-native.git", rev = "ae5ebb4e9ba32fd7c74b96293b9e5d8bcd7deabc", path = "modules/platform/window", package = "platform-window" }
webgpu = { git = "https://github.com/silk-lang/lib-native.git", rev = "ae5ebb4e9ba32fd7c74b96293b9e5d8bcd7deabc", path = "modules/gpu/webgpu", package = "gpu-webgpu" }
atlas = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "7e3b9c4802721e9b7aef521321f65c3297a88be8", path = "modules/atlas", package = "graphics-atlas" }
vector = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "7e3b9c4802721e9b7aef521321f65c3297a88be8", path = "modules/vector", package = "graphics-vector" }

# The development host, optimized: what to run JavaScript work on. The engine in a debug
# build is far slower (a frame of the starter page's motion takes 30 ms and more of
# JavaScript there, under 1 ms here), so animations stutter in it.
