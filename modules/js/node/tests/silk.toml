[package]
name = "ui-js-node-check"
description = "Runs fixtures/net.js in the runtime-backed ui-js realm against fixtures/server.mjs: fetch, WebSocket and the other web APIs, @silk/ui and __ui"
version = "0.1.0"
silk-version = "0.1.0-dev.74+205aea3f5b2e"

[dependencies]
ui_js = { path = "../..", package = "ui-js" }
ui_js_node = { path = "..", package = "ui-js-node" }
silkjs = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "b5e07596441340c30ec195bf01dd2bd8df528ebc", path = "modules/engine", package = "silkjs" }
node_runtime = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "b5e07596441340c30ec195bf01dd2bd8df528ebc", path = "modules/runtime", package = "silkjsruntime" }
