[package]
name = "ui-js-node-check"
description = "Runs fixtures/net.js in the runtime-backed ui-js realm against fixtures/server.mjs: fetch, WebSocket and the other web APIs, @silkui/core and __ui"
version = "0.1.0"
silk-version = "0.1.0-dev.86+c9d19330761b"

[dependencies]
ui_js = { path = "../..", package = "ui-js" }
ui_js_node = { path = "..", package = "ui-js-node" }
silkjs = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "e722c31aee4d9eec7876f24c9b4b825d480d5282", path = "modules/engine", package = "silkjs-engine" }
node_runtime = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "e722c31aee4d9eec7876f24c9b4b825d480d5282", path = "modules/runtime", package = "silkjs-runtime" }
