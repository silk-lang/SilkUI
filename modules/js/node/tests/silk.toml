[package]
name = "ui-js-node-check"
description = "Runs fixtures/net.js in the runtime-backed ui-js realm against fixtures/server.mjs: fetch, WebSocket and the other web APIs, @silkui/core and __ui"
version = "0.1.0"
silk-version = "0.1.0-dev.100+8f42b4e7342a"

[dependencies]
ui_js = { path = "../..", package = "ui-js" }
ui_js_node = { path = "..", package = "ui-js-node" }
silkjs = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "f7f07787c9c612eaeb686d04afcdbd6749e8b7f7", path = "modules/engine", package = "silkjs-engine" }
node_runtime = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "f7f07787c9c612eaeb686d04afcdbd6749e8b7f7", path = "modules/runtime", package = "silkjs-runtime" }
wasm = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "f7f07787c9c612eaeb686d04afcdbd6749e8b7f7", path = "modules/runtime/wamr", package = "silkjs-runtime-wamr" }
compress = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "f7f07787c9c612eaeb686d04afcdbd6749e8b7f7", path = "modules/runtime/compress", package = "silkjs-runtime-compress" }
http2 = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "f7f07787c9c612eaeb686d04afcdbd6749e8b7f7", path = "modules/runtime/http2", package = "silkjs-runtime-nghttp2" }
