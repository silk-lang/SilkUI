[package]
name = "ui-js-node-check"
description = "Runs fixtures/net.js in the runtime-backed ui-js realm against fixtures/server.mjs: fetch, WebSocket and the other web APIs, @silkui/core and __ui"
version = "0.1.0"
silk-version = "0.1.0-dev.87+37fa5f8857de"

[dependencies]
ui_js = { path = "../..", package = "ui-js" }
ui_js_node = { path = "..", package = "ui-js-node" }
silkjs = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "b36150f3597d599f0693b73b4617cdeaaebe8e70", path = "modules/engine", package = "silkjs-engine" }
node_runtime = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "b36150f3597d599f0693b73b4617cdeaaebe8e70", path = "modules/runtime", package = "silkjs-runtime" }
