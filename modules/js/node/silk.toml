[package]
name = "ui-js-node"
description = "Runs a ui-js application on the SilkJS runtime in a platform window: Node's and the web's APIs (fetch, WebSocket, URL, Intl...) beside @silkui/core"
version = "0.1.0"
silk-version = "0.1.0-dev.100+8f42b4e7342a"
kind = "library"
exports = ["lib"]

[dependencies]
ui_js = { path = "..", package = "ui-js" }
ui_js_window = { path = "../window", package = "ui-js-window" }
ui_tree = { path = "../../tree", package = "ui-tree" }
ui_tree_window = { path = "../../tree/window", package = "ui-tree-window" }
ui_inspect_server = { path = "../../inspect/server", package = "ui-inspect-server" }
webview = { path = "../../webview", package = "ui-webview" }
font_collection = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "6ac5cf92923c3d2e3993389ec563775b0d3f741c", path = "modules/collection", package = "font-collection" }
silkjs = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "f7f07787c9c612eaeb686d04afcdbd6749e8b7f7", path = "modules/engine", package = "silkjs-engine" }
node_runtime = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "f7f07787c9c612eaeb686d04afcdbd6749e8b7f7", path = "modules/runtime", package = "silkjs-runtime" }
window = { git = "https://github.com/silk-lang/lib-native.git", rev = "df99cfdfa30a510afff635e954a415a66520e926", path = "modules/platform/window", package = "platform-window" }
webgpu = { git = "https://github.com/silk-lang/lib-native.git", rev = "ae5ebb4e9ba32fd7c74b96293b9e5d8bcd7deabc", path = "modules/gpu/webgpu", package = "gpu-webgpu" }
atlas = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "facc2e7a0ce15bb1eeb8bc9e35c91351f329bb4f", path = "modules/atlas", package = "graphics-atlas" }
vector = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "facc2e7a0ce15bb1eeb8bc9e35c91351f329bb4f", path = "modules/vector", package = "graphics-vector" }
