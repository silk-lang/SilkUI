[package]
name = "ui-js-node-demo"
description = "A ui-js application on the SilkJS runtime in a window: the starter page, or the entry module given on the command line"
version = "0.1.0"
silk-version = "0.1.0-dev.87+37fa5f8857de"

[dependencies]
ui_js = { path = "../..", package = "ui-js" }
ui_js_node = { path = "..", package = "ui-js-node" }
ui_tree = { path = "../../../tree", package = "ui-tree" }
ui_tree_window = { path = "../../../tree/window", package = "ui-tree-window" }
ui_fixtures = { path = "../../../tree/fixtures", package = "ui-tree-fixtures" }
font_collection = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "771a3a53bf9e370313419b0dbd8598c1b9495246", path = "modules/collection", package = "font-collection" }
silkjs = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "7b404f3365041073b47ca35c98d6abb6d6d69e29", path = "modules/engine", package = "silkjs-engine" }
node_runtime = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "7b404f3365041073b47ca35c98d6abb6d6d69e29", path = "modules/runtime", package = "silkjs-runtime" }
window = { git = "https://github.com/silk-lang/lib-native.git", rev = "c069c8583fd56d7a4b90217b9abee021a35eb6b3", path = "modules/platform/window", package = "platform-window" }
webgpu = { git = "https://github.com/silk-lang/lib-native.git", rev = "ba018626769f673eef024abfe9c2bf1a6987d80e", path = "modules/gpu/webgpu", package = "gpu-webgpu" }
atlas = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "5352021805b6515f069ee41fa6a52f4bf1ec8157", path = "modules/atlas", package = "graphics-atlas" }
vector = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "5352021805b6515f069ee41fa6a52f4bf1ec8157", path = "modules/vector", package = "graphics-vector" }

wasm = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "7b404f3365041073b47ca35c98d6abb6d6d69e29", path = "modules/runtime/wamr", package = "silkjs-runtime-wamr" }
compress = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "7b404f3365041073b47ca35c98d6abb6d6d69e29", path = "modules/runtime/compress", package = "silkjs-runtime-compress" }
http2 = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "7b404f3365041073b47ca35c98d6abb6d6d69e29", path = "modules/runtime/http2", package = "silkjs-runtime-nghttp2" }
http = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "7b404f3365041073b47ca35c98d6abb6d6d69e29", path = "modules/runtime/llhttp", package = "silkjs-runtime-llhttp" }
database = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "7b404f3365041073b47ca35c98d6abb6d6d69e29", path = "modules/runtime/sqlite", package = "silkjs-runtime-sqlite" }
openssl = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "7b404f3365041073b47ca35c98d6abb6d6d69e29", path = "modules/runtime/openssl", package = "silkjs-runtime-openssl" }
inspector = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "7b404f3365041073b47ca35c98d6abb6d6d69e29", path = "modules/runtime/inspector", package = "silkjs-runtime-inspector" }
amaro = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "7b404f3365041073b47ca35c98d6abb6d6d69e29", path = "modules/runtime/amaro", package = "silkjs-runtime-amaro" }
addons = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "7b404f3365041073b47ca35c98d6abb6d6d69e29", path = "modules/runtime/napi", package = "silkjs-runtime-napi" }

[profiles.dev]
optimization = "speed"
