[package]
name = "ui-js-node-demo"
description = "A ui-js application on the SilkJS runtime in a window: the starter page, or the entry module given on the command line"
version = "0.1.0"
silk-version = "0.1.0-dev.88+17d1a1b4d501"

[dependencies]
ui_js = { path = "../..", package = "ui-js" }
ui_js_node = { path = "..", package = "ui-js-node" }
ui_tree = { path = "../../../tree", package = "ui-tree" }
ui_tree_window = { path = "../../../tree/window", package = "ui-tree-window" }
ui_fixtures = { path = "../../../tree/fixtures", package = "ui-tree-fixtures" }
font_collection = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "e5e8ef289ca3fd2a98bcfa496499a85b51239f0f", path = "modules/collection", package = "font-collection" }
silkjs = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "94a5dd6ae1b37f2c45088e2fe376bebfa3e742ea", path = "modules/engine", package = "silkjs-engine" }
node_runtime = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "94a5dd6ae1b37f2c45088e2fe376bebfa3e742ea", path = "modules/runtime", package = "silkjs-runtime" }
window = { git = "https://github.com/silk-lang/lib-native.git", rev = "597a202c86846ddf86b2791611dd6e7f50dd3deb", path = "modules/platform/window", package = "platform-window" }
webgpu = { git = "https://github.com/silk-lang/lib-native.git", rev = "597a202c86846ddf86b2791611dd6e7f50dd3deb", path = "modules/gpu/webgpu", package = "gpu-webgpu" }
atlas = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "a4cc4a88efdcc88d9e0f14ad62710f71c0069c8c", path = "modules/atlas", package = "graphics-atlas" }
vector = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "a4cc4a88efdcc88d9e0f14ad62710f71c0069c8c", path = "modules/vector", package = "graphics-vector" }

wasm = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "94a5dd6ae1b37f2c45088e2fe376bebfa3e742ea", path = "modules/runtime/wamr", package = "silkjs-runtime-wamr" }
compress = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "94a5dd6ae1b37f2c45088e2fe376bebfa3e742ea", path = "modules/runtime/compress", package = "silkjs-runtime-compress" }
http2 = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "94a5dd6ae1b37f2c45088e2fe376bebfa3e742ea", path = "modules/runtime/http2", package = "silkjs-runtime-nghttp2" }
http = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "94a5dd6ae1b37f2c45088e2fe376bebfa3e742ea", path = "modules/runtime/llhttp", package = "silkjs-runtime-llhttp" }
database = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "94a5dd6ae1b37f2c45088e2fe376bebfa3e742ea", path = "modules/runtime/sqlite", package = "silkjs-runtime-sqlite" }
openssl = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "94a5dd6ae1b37f2c45088e2fe376bebfa3e742ea", path = "modules/runtime/openssl", package = "silkjs-runtime-openssl" }
inspector = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "94a5dd6ae1b37f2c45088e2fe376bebfa3e742ea", path = "modules/runtime/inspector", package = "silkjs-runtime-inspector" }
amaro = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "94a5dd6ae1b37f2c45088e2fe376bebfa3e742ea", path = "modules/runtime/amaro", package = "silkjs-runtime-amaro" }
addons = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "94a5dd6ae1b37f2c45088e2fe376bebfa3e742ea", path = "modules/runtime/napi", package = "silkjs-runtime-napi" }

[profiles.dev]
optimization = "speed"
