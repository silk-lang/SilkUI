[package]
name = "ui-js-node-demo"
description = "A ui-js application on the SilkJS runtime in a window: the starter page, or the entry module given on the command line"
version = "0.1.0"
silk-version = "0.1.0-dev.94+93906b8028e6"

[dependencies]
ui_js = { path = "../..", package = "ui-js" }
ui_js_node = { path = "..", package = "ui-js-node" }
ui_tree = { path = "../../../tree", package = "ui-tree" }
ui_tree_window = { path = "../../../tree/window", package = "ui-tree-window" }
ui_fixtures = { path = "../../../tree/fixtures", package = "ui-tree-fixtures" }
font_collection = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "aaaf14f23a6a764edaf999962cf173554fbe6141", path = "modules/collection", package = "font-collection" }
silkjs = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "80b4ace6491259b56b3b49486b03b32674a235eb", path = "modules/engine", package = "silkjs-engine" }
node_runtime = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "80b4ace6491259b56b3b49486b03b32674a235eb", path = "modules/runtime", package = "silkjs-runtime" }
window = { git = "https://github.com/silk-lang/lib-native.git", rev = "ae5ebb4e9ba32fd7c74b96293b9e5d8bcd7deabc", path = "modules/platform/window", package = "platform-window" }
webgpu = { git = "https://github.com/silk-lang/lib-native.git", rev = "ae5ebb4e9ba32fd7c74b96293b9e5d8bcd7deabc", path = "modules/gpu/webgpu", package = "gpu-webgpu" }
atlas = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "c5fc48eb37e06b217ac96effa7801866e46f90ed", path = "modules/atlas", package = "graphics-atlas" }
vector = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "c5fc48eb37e06b217ac96effa7801866e46f90ed", path = "modules/vector", package = "graphics-vector" }

