[package]
name = "ui-js-node-demo"
description = "A ui-js application on the SilkJS runtime in a window: the starter page, or the entry module given on the command line"
version = "0.1.0"
silk-version = "0.1.0-dev.90+43166993a300"

[dependencies]
ui_js = { path = "../..", package = "ui-js" }
ui_js_node = { path = "..", package = "ui-js-node" }
ui_tree = { path = "../../../tree", package = "ui-tree" }
ui_tree_window = { path = "../../../tree/window", package = "ui-tree-window" }
ui_fixtures = { path = "../../../tree/fixtures", package = "ui-tree-fixtures" }
font_collection = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "f78c62feabd50b0f8cd444d97ec2f939bf8a9d9a", path = "modules/collection", package = "font-collection" }
silkjs = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "33608cc5dc56658347e56f855cb110726363a0cd", path = "modules/engine", package = "silkjs-engine" }
node_runtime = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "33608cc5dc56658347e56f855cb110726363a0cd", path = "modules/runtime", package = "silkjs-runtime" }
window = { git = "https://github.com/silk-lang/lib-native.git", rev = "2be8cba70651433892d24c137badc326627af07f", path = "modules/platform/window", package = "platform-window" }
webgpu = { git = "https://github.com/silk-lang/lib-native.git", rev = "2be8cba70651433892d24c137badc326627af07f", path = "modules/gpu/webgpu", package = "gpu-webgpu" }
atlas = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "0c0b592f53afeb0b8fb2ab0552adf71df0267d0c", path = "modules/atlas", package = "graphics-atlas" }
vector = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "0c0b592f53afeb0b8fb2ab0552adf71df0267d0c", path = "modules/vector", package = "graphics-vector" }

wasm = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "33608cc5dc56658347e56f855cb110726363a0cd", path = "modules/runtime/wamr", package = "silkjs-runtime-wamr" }
compress = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "33608cc5dc56658347e56f855cb110726363a0cd", path = "modules/runtime/compress", package = "silkjs-runtime-compress" }
http2 = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "33608cc5dc56658347e56f855cb110726363a0cd", path = "modules/runtime/http2", package = "silkjs-runtime-nghttp2" }
http = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "33608cc5dc56658347e56f855cb110726363a0cd", path = "modules/runtime/llhttp", package = "silkjs-runtime-llhttp" }
database = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "33608cc5dc56658347e56f855cb110726363a0cd", path = "modules/runtime/sqlite", package = "silkjs-runtime-sqlite" }
openssl = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "33608cc5dc56658347e56f855cb110726363a0cd", path = "modules/runtime/openssl", package = "silkjs-runtime-openssl" }
inspector = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "33608cc5dc56658347e56f855cb110726363a0cd", path = "modules/runtime/inspector", package = "silkjs-runtime-inspector" }
amaro = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "33608cc5dc56658347e56f855cb110726363a0cd", path = "modules/runtime/amaro", package = "silkjs-runtime-amaro" }
addons = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "33608cc5dc56658347e56f855cb110726363a0cd", path = "modules/runtime/napi", package = "silkjs-runtime-napi" }

[profiles.dev]
optimization = "speed"
