[package]
name = "ui-js-node-demo"
description = "A ui-js application on the SilkJS runtime in a window: the starter page, or the entry module given on the command line"
version = "0.1.0"
silk-version = "0.1.0-pipeline.1"

[dependencies]
ui_js = { path = "../..", package = "ui-js" }
ui_js_node = { path = "..", package = "ui-js-node" }
ui_tree = { path = "../../../tree", package = "ui-tree" }
ui_tree_window = { path = "../../../tree/window", package = "ui-tree-window" }
ui_fixtures = { path = "../../../tree/fixtures", package = "ui-tree-fixtures" }
font_collection = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "c6df88819e2f99ad73051d5254271b5a5cb24e7c", path = "modules/collection", package = "font-collection" }
silkjs = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "748705385e6d15a2fd1db02f546b873dbc015ef8", path = "modules/engine", package = "silkjs-engine" }
node_runtime = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "748705385e6d15a2fd1db02f546b873dbc015ef8", path = "modules/runtime", package = "silkjs-runtime" }
window = { git = "https://github.com/silk-lang/lib-native.git", rev = "8b411d1f2e4848a6a93d5cf26b488cd52db64069", path = "modules/platform/window", package = "platform-window" }
webgpu = { git = "https://github.com/silk-lang/lib-native.git", rev = "8b411d1f2e4848a6a93d5cf26b488cd52db64069", path = "modules/gpu/webgpu", package = "gpu-webgpu" }
atlas = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "4a90de327acd6f62d060019ab49dba5490262f69", path = "modules/atlas", package = "graphics-atlas" }
vector = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "4a90de327acd6f62d060019ab49dba5490262f69", path = "modules/vector", package = "graphics-vector" }
