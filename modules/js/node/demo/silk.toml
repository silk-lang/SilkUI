[package]
name = "ui-js-node-demo"
description = "A ui-js application on the SilkJS runtime in a window: the starter page, or the entry module given on the command line"
version = "0.1.0"
silk-version = "0.1.0-dev.94+93906b8028e6"

[dependencies]
ui_js = { path = "../..", package = "ui-js" }
ui_js_node = { path = "..", package = "ui-js-node" }
ui_tree = { path = "../../../tree", package = "ui-tree" }
ui_tree_window = { path = "../../../tree/window", package = "ui-tree-window" }
ui_fixtures = { path = "../../../tree/fixtures", package = "ui-tree-fixtures" }
font_collection = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "ca7a2b41659275ce1b5aafdb846b89ac48061658", path = "modules/collection", package = "font-collection" }
silkjs = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "3c842454fbef048231820cf71468056321cfad06", path = "modules/engine", package = "silkjs-engine" }
node_runtime = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "3c842454fbef048231820cf71468056321cfad06", path = "modules/runtime", package = "silkjs-runtime" }
window = { git = "https://github.com/silk-lang/lib-native.git", rev = "3386d71470b7e45007396591ff231448e98f992f", path = "modules/platform/window", package = "platform-window" }
webgpu = { git = "https://github.com/silk-lang/lib-native.git", rev = "3386d71470b7e45007396591ff231448e98f992f", path = "modules/gpu/webgpu", package = "gpu-webgpu" }
atlas = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "07f1c411416638fe54956446bf5332608cdb90e7", path = "modules/atlas", package = "graphics-atlas" }
vector = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "07f1c411416638fe54956446bf5332608cdb90e7", path = "modules/vector", package = "graphics-vector" }

wasm = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "3c842454fbef048231820cf71468056321cfad06", path = "modules/runtime/wamr", package = "silkjs-runtime-wamr" }
compress = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "3c842454fbef048231820cf71468056321cfad06", path = "modules/runtime/compress", package = "silkjs-runtime-compress" }
http2 = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "3c842454fbef048231820cf71468056321cfad06", path = "modules/runtime/http2", package = "silkjs-runtime-nghttp2" }
http = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "3c842454fbef048231820cf71468056321cfad06", path = "modules/runtime/llhttp", package = "silkjs-runtime-llhttp" }
database = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "3c842454fbef048231820cf71468056321cfad06", path = "modules/runtime/sqlite", package = "silkjs-runtime-sqlite" }
openssl = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "3c842454fbef048231820cf71468056321cfad06", path = "modules/runtime/openssl", package = "silkjs-runtime-openssl" }
inspector = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "3c842454fbef048231820cf71468056321cfad06", path = "modules/runtime/inspector", package = "silkjs-runtime-inspector" }
amaro = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "3c842454fbef048231820cf71468056321cfad06", path = "modules/runtime/amaro", package = "silkjs-runtime-amaro" }
addons = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "3c842454fbef048231820cf71468056321cfad06", path = "modules/runtime/napi", package = "silkjs-runtime-napi" }

[profiles.dev]
optimization = "speed"
