font_collection = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "b3c1c268a9e370b4b7253704406b903d14b5b0bc", path = "modules/collection", package = "font-collection" }
layout = { git = "https://github.com/silk-lang/lib-css.git", rev = "1d387ca416aad3fc0df3d63b732cdc7e8364ca46", path = "modules/layout", package = "css-layout" }
