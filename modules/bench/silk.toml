version = "0.1.0"
license = "MIT"

[dependencies]
ui_tree = { git = "https://github.com/silk-lang/silkui.git", rev = "c10419a65ff3485eb63ea7b8903cf063ae635e17", path = "modules/tree", package = "ui-tree" }
loom = { git = "https://github.com/silk-lang/loom.git", rev = "fea62907a159a6899ee9dc47a9f7d0bcdecd6cdb", path = "modules/loom", package = "loom" }
ui_fixtures = { git = "https://github.com/silk-lang/silkui.git", rev = "c10419a65ff3485eb63ea7b8903cf063ae635e17", path = "modules/tree/fixtures", package = "ui-tree-fixtures" }
font_collection = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "1a2841827135a75d6769b4d533804177cbe65cd3", path = "modules/collection", package = "font-collection" }
layout = { git = "https://github.com/silk-lang/lib-css.git", rev = "d2ca2fd1dc607a505f25490eecee5142fe4c6eaf", path = "modules/layout", package = "css-layout" }
