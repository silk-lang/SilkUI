[package]
name = "ui-bench"
description = "Benchmarks of the retained tree and the framework: tile walls, inherited styles, text, layout, invalidation, input and view diffing"
version = "0.1.0"
license = "MIT"

[dependencies]
ui_tree = { git = "https://github.com/silk-lang/silkui.git", rev = "d832ab4ecbb99dc1354646f830351c8ac3503f32", path = "modules/tree", package = "ui-tree" }
loom = { git = "https://github.com/silk-lang/loom.git", rev = "620619466f882f1b76a2822ec25959ecd4fd9b29", path = "modules/loom", package = "loom" }
ui_fixtures = { git = "https://github.com/silk-lang/silkui.git", rev = "d832ab4ecbb99dc1354646f830351c8ac3503f32", path = "modules/tree/fixtures", package = "ui-tree-fixtures" }
font_collection = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "8f79a1d913f8d1d7ba8f0ffed852bfb67fd0cd90", path = "modules/collection", package = "font-collection" }
layout = { git = "https://github.com/silk-lang/lib-css.git", rev = "e0c9a7fff1a76db7d2caf956edacfc134cea88b7", path = "modules/layout", package = "css-layout" }
