loom = { git = "https://github.com/silk-lang/loom.git", rev = "e2fdea349c9d4dcdc53ef055db04999c02d433f8", path = "modules/loom", package = "loom" }
ui_fixtures = { git = "https://github.com/silk-lang/silkui.git", rev = "f0cef1464610671c46519537fb42743fe1eb0e4a", path = "modules/tree/fixtures", package = "ui-tree-fixtures" }
font_collection = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "dab6cdb5f957ca062accbce86523965c93e791a6", path = "modules/collection", package = "font-collection" }
layout = { git = "https://github.com/silk-lang/lib-css.git", rev = "a8b1c8f85f0d601a70c18af66169aea06e00b4c0", path = "modules/layout", package = "css-layout" }
