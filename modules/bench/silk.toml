[package]
name = "ui-bench"
description = "Benchmarks of the retained tree and the framework: tile walls, inherited styles, text, layout, invalidation, input and view diffing"
version = "0.1.0"
silk-version = "0.1.0-pipeline.1"
license = "MIT"

[dependencies]
ui_tree = { path = "../tree", package = "ui-tree" }
loom = { git = "https://github.com/silk-lang/loom.git", rev = "c8d7c61d969c88b2262f281841e8b099e5f9c760", path = "modules/loom", package = "loom" }
ui_fixtures = { path = "../tree/fixtures", package = "ui-tree-fixtures" }
font_collection = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "c6df88819e2f99ad73051d5254271b5a5cb24e7c", path = "modules/collection", package = "font-collection" }
layout = { git = "https://github.com/silk-lang/lib-css.git", rev = "28191216b251c4625e9f840a17424e99251e3c4f", path = "modules/layout", package = "css-layout" }
