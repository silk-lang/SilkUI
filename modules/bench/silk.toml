loom = { git = "https://github.com/silk-lang/loom.git", rev = "e2fdea349c9d4dcdc53ef055db04999c02d433f8", path = "modules/loom", package = "loom" }
ui_fixtures = { git = "https://github.com/silk-lang/silkui.git", rev = "f0cef1464610671c46519537fb42743fe1eb0e4a", path = "modules/tree/fixtures", package = "ui-tree-fixtures" }
font_collection = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "3de2584b6e6e018a66ad2b33faaea682eab9fd65", path = "modules/collection", package = "font-collection" }
layout = { git = "https://github.com/silk-lang/lib-css.git", rev = "5ba29b06dcbbedc8d9f3f43605be97ec6c65f7b5", path = "modules/layout", package = "css-layout" }
