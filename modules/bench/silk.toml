font_collection = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "ca7a2b41659275ce1b5aafdb846b89ac48061658", path = "modules/collection", package = "font-collection" }
layout = { git = "https://github.com/silk-lang/lib-css.git", rev = "c37a7d4a60c1ef4bf2062fe8c72c28f9b3f77459", path = "modules/layout", package = "css-layout" }
