loom = { git = "https://github.com/silk-lang/loom.git", rev = "2256bcfad2d694c1e86b81bcf05bdc67cded3cb3", path = "modules/loom", package = "loom" }
ui_fixtures = { git = "https://github.com/silk-lang/silkui.git", rev = "c07ee77ec49f3a86e1dd3714909b448823f60719", path = "modules/tree/fixtures", package = "ui-tree-fixtures" }
font_collection = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "3de2584b6e6e018a66ad2b33faaea682eab9fd65", path = "modules/collection", package = "font-collection" }
layout = { git = "https://github.com/silk-lang/lib-css.git", rev = "9ee73d3cec53db10ae1534ccbec4dfb5296c73ef", path = "modules/layout", package = "css-layout" }
