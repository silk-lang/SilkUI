version = "0.1.0"
license = "MIT"

[dependencies]
ui_tree = { git = "https://github.com/silk-lang/silkui.git", rev = "edd2b69455340c890271897154e81882d0123da0", path = "modules/tree", package = "ui-tree" }
loom = { git = "https://github.com/silk-lang/loom.git", rev = "750d006a5d0b98e2fe035e4ee0557afae13c414c", path = "modules/loom", package = "loom" }
ui_fixtures = { git = "https://github.com/silk-lang/silkui.git", rev = "edd2b69455340c890271897154e81882d0123da0", path = "modules/tree/fixtures", package = "ui-tree-fixtures" }
font_collection = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "ca7a2b41659275ce1b5aafdb846b89ac48061658", path = "modules/collection", package = "font-collection" }
layout = { git = "https://github.com/silk-lang/lib-css.git", rev = "c37a7d4a60c1ef4bf2062fe8c72c28f9b3f77459", path = "modules/layout", package = "css-layout" }
