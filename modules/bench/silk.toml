version = "0.1.0"
license = "MIT"

[dependencies]
ui_tree = { git = "https://github.com/silk-lang/silkui.git", rev = "cd98fa0c45d80c364da631ac4b0209c03c062699", path = "modules/tree", package = "ui-tree" }
loom = { git = "https://github.com/silk-lang/loom.git", rev = "24bf7206b476498473a6426a6c0f56c4fd887130", path = "modules/loom", package = "loom" }
ui_fixtures = { git = "https://github.com/silk-lang/silkui.git", rev = "cd98fa0c45d80c364da631ac4b0209c03c062699", path = "modules/tree/fixtures", package = "ui-tree-fixtures" }
font_collection = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "8f79a1d913f8d1d7ba8f0ffed852bfb67fd0cd90", path = "modules/collection", package = "font-collection" }
layout = { git = "https://github.com/silk-lang/lib-css.git", rev = "e0c9a7fff1a76db7d2caf956edacfc134cea88b7", path = "modules/layout", package = "css-layout" }
