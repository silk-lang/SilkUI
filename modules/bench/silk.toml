[package]
name = "ui-bench"
description = "Benchmarks of the retained tree and the framework: tile walls, inherited styles, text, layout, invalidation, input and view diffing"
version = "0.1.0"
license = "MIT"

[dependencies]
ui_tree = { git = "https://github.com/silk-lang/silkui.git", rev = "d3fcc84cfb5ee4f547bcbb0259afe3f5c7970c0f", path = "modules/tree", package = "ui-tree" }
loom = { git = "https://github.com/silk-lang/loom.git", rev = "d82400ff156cfa12e0d89e1250d27637cce7ab18", path = "modules/loom", package = "loom" }
ui_fixtures = { git = "https://github.com/silk-lang/silkui.git", rev = "d3fcc84cfb5ee4f547bcbb0259afe3f5c7970c0f", path = "modules/tree/fixtures", package = "ui-tree-fixtures" }
font_collection = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "6ac5cf92923c3d2e3993389ec563775b0d3f741c", path = "modules/collection", package = "font-collection" }
layout = { git = "https://github.com/silk-lang/lib-css.git", rev = "6cb4084cf79e2bbd398a2e2dcbc91b4a6b43a61d", path = "modules/layout", package = "css-layout" }
