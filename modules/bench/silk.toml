[package]
name = "ui-bench"
description = "Benchmarks of the retained tree and the framework: tile walls, inherited styles, text, layout, invalidation, input and view diffing"
version = "0.1.0"
silk-version = "0.1.0-dev.74+205aea3f5b2e"
license = "MIT"

[dependencies]
ui_tree = { path = "../tree", package = "ui-tree" }
loom = { git = "https://github.com/silk-lang/loom.git", rev = "63b4d0bfb8b6ac485c1c95cd99eff06e6a6649eb", path = "modules/loom", package = "loom" }
ui_fixtures = { path = "../tree/fixtures", package = "ui-tree-fixtures" }
font_collection = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "7667e203b385ba0d0d704f88a9cd37b1859148a6", path = "modules/collection", package = "font-collection" }
layout = { git = "https://github.com/silk-lang/lib-css.git", rev = "7be3a9f348e3bf51874d7ead899d8192fda402dd", path = "modules/layout", package = "css-layout" }
