[package]
name = "ui-sprites"
description = "SVG icons and decoded images as atlas tiles for the UI renderer"
version = "0.1.0"
silk-version = "0.1.0-dev.87+37fa5f8857de"
kind = "library"
exports = ["lib", "uploads", "icons", "images"]

[dependencies]
atlas = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "7b5b880008afdccec630e8afe3c234a9b670ae79", path = "modules/atlas", package = "graphics-atlas" }
codec = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "7b5b880008afdccec630e8afe3c234a9b670ae79", path = "modules/codec", package = "graphics-codec" }
svg_render = { git = "https://github.com/silk-lang/lib-svg.git", rev = "5e3215824710ef510cd40e8a639814d391b1696e", path = "modules/render", package = "svg-render" }
svg_core = { git = "https://github.com/silk-lang/lib-svg.git", rev = "5e3215824710ef510cd40e8a639814d391b1696e", path = "modules", package = "svg" }
svg_css = { git = "https://github.com/silk-lang/lib-css.git", rev = "700bd6ad531b9ebe75fd3fb74de0b0485a35041b", path = "modules/style", package = "css-style" }
svg_fonts = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "835a73e071830864850e4fd20eda4e5f44612470", path = "modules/faces", package = "font-faces" }
