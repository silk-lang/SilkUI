[package]
name = "ui-sprites"
description = "SVG icons and decoded images as atlas tiles for the UI renderer"
version = "0.1.0"
kind = "library"
exports = ["lib", "uploads", "icons", "images"]

[dependencies]
atlas = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "19746fc2516860bea1eb1e367566bc434b9e335a", path = "modules/atlas", package = "graphics-atlas" }
codec = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "19746fc2516860bea1eb1e367566bc434b9e335a", path = "modules/codec", package = "graphics-codec" }
svg_render = { git = "https://github.com/silk-lang/lib-svg.git", rev = "4e390af4dda9cddb2479d0c2c8770ee7e7d01c37", path = "modules/render", package = "svg-render" }
svg_core = { git = "https://github.com/silk-lang/lib-svg.git", rev = "4e390af4dda9cddb2479d0c2c8770ee7e7d01c37", path = "modules", package = "svg" }
svg_css = { git = "https://github.com/silk-lang/lib-css.git", rev = "d2ca2fd1dc607a505f25490eecee5142fe4c6eaf", path = "modules/style", package = "css-style" }
svg_fonts = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "1a2841827135a75d6769b4d533804177cbe65cd3", path = "modules/faces", package = "font-faces" }
