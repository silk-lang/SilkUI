[package]
name = "ui-sprites"
description = "SVG icons and decoded images as atlas tiles for the UI renderer"
version = "0.1.0"
kind = "library"
exports = ["lib", "uploads", "icons", "images"]

[dependencies]
atlas = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "27fe1c042203204009a7d86abc72b3c02fbaaa96", path = "modules/atlas", package = "graphics-atlas" }
codec = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "27fe1c042203204009a7d86abc72b3c02fbaaa96", path = "modules/codec", package = "graphics-codec" }
svg_render = { git = "https://github.com/silk-lang/lib-svg.git", rev = "efc0028ed754d29f31401c245e174f8380bb7408", path = "modules/render", package = "svg-render" }
svg_core = { git = "https://github.com/silk-lang/lib-svg.git", rev = "efc0028ed754d29f31401c245e174f8380bb7408", path = "modules", package = "svg" }
svg_css = { git = "https://github.com/silk-lang/lib-css.git", rev = "2bfeb616ae0e7eb566aad62481be7b42b206042d", path = "modules/style", package = "css-style" }
svg_fonts = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "8429196de1f54d47c946429ad0784853c14709d5", path = "modules/faces", package = "font-faces" }
