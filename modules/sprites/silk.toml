[package]
name = "ui-sprites"
description = "SVG icons and decoded images as atlas tiles for the UI renderer"
version = "0.1.0"
silk-version = "0.1.0-dev.74+205aea3f5b2e"
kind = "library"
exports = ["lib", "uploads", "icons", "images"]

[dependencies]
atlas = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "c3e38a82272ad41884e3a8b17da590ce2c9d40e2", path = "modules/atlas", package = "graphics-atlas" }
codec = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "c3e38a82272ad41884e3a8b17da590ce2c9d40e2", path = "modules/codec", package = "graphics-codec" }
svg_render = { git = "https://github.com/silk-lang/lib-svg.git", rev = "d4f9aaf820021153f424bb3da0e2e6b1b0d2300f", path = "modules/render", package = "svg-render" }
svg_core = { git = "https://github.com/silk-lang/lib-svg.git", rev = "d4f9aaf820021153f424bb3da0e2e6b1b0d2300f", path = "modules", package = "svg" }
svg_css = { git = "https://github.com/silk-lang/lib-css.git", rev = "34031c9fb2f16c999c8f9d8cff08d65e301d5e2d", path = "modules/style", package = "css-style" }
svg_fonts = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "d7a653cc12605259c447b27061bea4220dea70a8", path = "modules/faces", package = "font-faces" }
