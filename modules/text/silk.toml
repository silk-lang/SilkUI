[package]
name = "ui-text"
description = "css-layout's TextMeasure over real fonts, with line breaking, bidi and fallback from std"
version = "0.1.0"
kind = "library"
exports = ["lib", "fonts", "set", "glyphs", "analysis", "shaping", "system"]

[dependencies]
layout = { git = "https://github.com/silk-lang/lib-css.git", rev = "c4b6224569774005eae910f464dd763df74fae55", path = "modules/layout", package = "css-layout" }
properties = { git = "https://github.com/silk-lang/lib-css.git", rev = "c4b6224569774005eae910f464dd763df74fae55", path = "modules/properties", package = "css-properties" }
font_collection = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "66d81fc2655e420301030fc38f306e28f4172441", path = "modules/collection", package = "font-collection" }
faces = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "66d81fc2655e420301030fc38f306e28f4172441", path = "modules/faces", package = "font-faces" }
harfrust = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "66d81fc2655e420301030fc38f306e28f4172441", path = "modules/shape", package = "font-shape" }
read_fonts = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "66d81fc2655e420301030fc38f306e28f4172441", path = "modules/parse", package = "font-parse" }
font_types = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "66d81fc2655e420301030fc38f306e28f4172441", path = "modules/types", package = "font-types" }
raster = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "66d81fc2655e420301030fc38f306e28f4172441", path = "modules/raster", package = "font-raster" }
