[package]
name = "ui-text"
description = "css-layout's TextMeasure over real fonts, with line breaking, bidi and fallback from std"
version = "0.1.0"
silk-version = "0.1.0-dev.87+37fa5f8857de"
kind = "library"
exports = ["lib", "fonts", "set", "glyphs", "analysis", "shaping", "system"]

[dependencies]
layout = { git = "https://github.com/silk-lang/lib-css.git", rev = "5af05498709b2d4dc36556b149402b5bcdd400b2", path = "modules/layout", package = "css-layout" }
properties = { git = "https://github.com/silk-lang/lib-css.git", rev = "5af05498709b2d4dc36556b149402b5bcdd400b2", path = "modules/properties", package = "css-properties" }
font_collection = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "3c6ed40a98bd296ecf2e054f7c01010d783164eb", path = "modules/collection", package = "font-collection" }
faces = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "3c6ed40a98bd296ecf2e054f7c01010d783164eb", path = "modules/faces", package = "font-faces" }
harfrust = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "3c6ed40a98bd296ecf2e054f7c01010d783164eb", path = "modules/shape", package = "font-shape" }
read_fonts = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "3c6ed40a98bd296ecf2e054f7c01010d783164eb", path = "modules/parse", package = "font-parse" }
font_types = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "3c6ed40a98bd296ecf2e054f7c01010d783164eb", path = "modules/types", package = "font-types" }
raster = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "3c6ed40a98bd296ecf2e054f7c01010d783164eb", path = "modules/raster", package = "font-raster" }
