ui_tree = { git = "https://github.com/silk-lang/silkui.git", rev = "cd98fa0c45d80c364da631ac4b0209c03c062699", path = "modules/tree", package = "ui-tree" }
ui_tree_window = { git = "https://github.com/silk-lang/silkui.git", rev = "cd98fa0c45d80c364da631ac4b0209c03c062699", path = "modules/tree/window", package = "ui-tree-window" }
