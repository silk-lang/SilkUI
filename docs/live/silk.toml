loom = { git = "https://github.com/silk-lang/loom.git", rev = "fea62907a159a6899ee9dc47a9f7d0bcdecd6cdb", path = "modules/loom", package = "loom" }
loom_window = { git = "https://github.com/silk-lang/loom.git", rev = "fea62907a159a6899ee9dc47a9f7d0bcdecd6cdb", path = "modules/loom/window", package = "loom-window" }
ui_tree = { git = "https://github.com/silk-lang/silkui.git", rev = "c10419a65ff3485eb63ea7b8903cf063ae635e17", path = "modules/tree", package = "ui-tree" }
ui_tree_window = { git = "https://github.com/silk-lang/silkui.git", rev = "c10419a65ff3485eb63ea7b8903cf063ae635e17", path = "modules/tree/window", package = "ui-tree-window" }
