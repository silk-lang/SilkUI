[package]
name = "ui-docs-shots"
description = "Draws the pictures the Silk UI docs show, from the example programs"
version = "0.1.0"
silk-version = "0.1.0-dev.74+205aea3f5b2e"
kind = "executable"

[dependencies]
examples = { path = "../examples", package = "ui-docs-examples" }
window_client = { git = "https://github.com/silk-lang/silkui.git", rev = "858a8cf20a9f12175218a969a64422c9d2107498", path = "docs/examples/window", package = "ui-docs-window-client" }
loom = { git = "https://github.com/silk-lang/loom.git", rev = "ba60daa783953bca13fca876ad23e145ff93a3c5", path = "modules/loom", package = "loom" }
loom_tree = { git = "https://github.com/silk-lang/loom.git", rev = "ba60daa783953bca13fca876ad23e145ff93a3c5", path = "modules/loom/tree", package = "loom-tree" }
ui_tree = { git = "https://github.com/silk-lang/silkui.git", rev = "858a8cf20a9f12175218a969a64422c9d2107498", path = "modules/tree", package = "ui-tree" }
ui_tree_window = { git = "https://github.com/silk-lang/silkui.git", rev = "858a8cf20a9f12175218a969a64422c9d2107498", path = "modules/tree/window", package = "ui-tree-window" }
