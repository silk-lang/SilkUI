[package]
name = "ui-docs-shots"
description = "Draws the pictures the Silk UI docs show, from the example programs"
version = "0.1.0"
silk-version = "0.1.0-dev.74+205aea3f5b2e"
kind = "executable"

[dependencies]
examples = { path = "../examples", package = "ui-docs-examples" }
window_client = { git = "https://github.com/silk-lang/silkui.git", rev = "e5b5b19f18ca2d522a8df378225a075f62f03f75", path = "docs/examples/window", package = "ui-docs-window-client" }
loom = { git = "https://github.com/silk-lang/loom.git", rev = "70123adb6f8a90a538ac632c3b94473a6c04561f", path = "modules/loom", package = "loom" }
loom_tree = { git = "https://github.com/silk-lang/loom.git", rev = "70123adb6f8a90a538ac632c3b94473a6c04561f", path = "modules/loom/tree", package = "loom-tree" }
ui_tree = { git = "https://github.com/silk-lang/silkui.git", rev = "e5b5b19f18ca2d522a8df378225a075f62f03f75", path = "modules/tree", package = "ui-tree" }
ui_tree_window = { git = "https://github.com/silk-lang/silkui.git", rev = "e5b5b19f18ca2d522a8df378225a075f62f03f75", path = "modules/tree/window", package = "ui-tree-window" }
ui_fixtures = { git = "https://github.com/silk-lang/silkui.git", rev = "e5b5b19f18ca2d522a8df378225a075f62f03f75", path = "modules/tree/fixtures", package = "ui-tree-fixtures" }
ui_assets = { git = "https://github.com/silk-lang/silkui.git", rev = "e5b5b19f18ca2d522a8df378225a075f62f03f75", path = "modules/assets", package = "ui-assets" }
font_collection = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "3de2584b6e6e018a66ad2b33faaea682eab9fd65", path = "modules/collection", package = "font-collection" }
codec = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "b5d64cf9d225f57378e716b13ce4fda892b37daf", path = "modules/codec", package = "graphics-codec" }
vector = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "b5d64cf9d225f57378e716b13ce4fda892b37daf", path = "modules/vector", package = "graphics-vector" }
svg_css = { git = "https://github.com/silk-lang/lib-css.git", rev = "9caba21cb0490ef6f85795d064167ce26309216a", path = "modules/style", package = "css-style" }
