[package]
name = "ui-docs-shots"
description = "Draws the pictures the Silk UI docs show, from the example programs"
version = "0.1.0"
silk-version = "0.1.0-pipeline.1"
kind = "executable"

[dependencies]
examples = { path = "../examples", package = "ui-docs-examples" }
window_client = { git = "https://github.com/silk-lang/silkui.git", rev = "7a78ea4edcc994505e08e65e1014c9ea937ec22a", path = "docs/examples/window", package = "ui-docs-window-client" }
loom = { git = "https://github.com/silk-lang/loom.git", rev = "d12fd8ed4e8bfcce7dcc0a6b949546877fcf7314", path = "modules/loom", package = "loom" }
loom_tree = { git = "https://github.com/silk-lang/loom.git", rev = "d12fd8ed4e8bfcce7dcc0a6b949546877fcf7314", path = "modules/loom/tree", package = "loom-tree" }
ui_tree = { git = "https://github.com/silk-lang/silkui.git", rev = "7a78ea4edcc994505e08e65e1014c9ea937ec22a", path = "modules/tree", package = "ui-tree" }
ui_tree_window = { git = "https://github.com/silk-lang/silkui.git", rev = "7a78ea4edcc994505e08e65e1014c9ea937ec22a", path = "modules/tree/window", package = "ui-tree-window" }
ui_fixtures = { git = "https://github.com/silk-lang/silkui.git", rev = "7a78ea4edcc994505e08e65e1014c9ea937ec22a", path = "modules/tree/fixtures", package = "ui-tree-fixtures" }
ui_assets = { git = "https://github.com/silk-lang/silkui.git", rev = "7a78ea4edcc994505e08e65e1014c9ea937ec22a", path = "modules/assets", package = "ui-assets" }
font_collection = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "c6df88819e2f99ad73051d5254271b5a5cb24e7c", path = "modules/collection", package = "font-collection" }
codec = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "4a90de327acd6f62d060019ab49dba5490262f69", path = "modules/codec", package = "graphics-codec" }
vector = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "4a90de327acd6f62d060019ab49dba5490262f69", path = "modules/vector", package = "graphics-vector" }
