[package]
name = "ui-docs-shots"
description = "Draws the pictures the Silk UI docs show, from the example programs"
version = "0.1.0"
silk-version = "0.1.0-dev.74+205aea3f5b2e"
kind = "executable"

[dependencies]
examples = { path = "../examples", package = "ui-docs-examples" }
window_client = { git = "https://github.com/silk-lang/silkui.git", rev = "6abafabff55a95d0135587321c22a3e41c3e89e4", path = "docs/examples/window", package = "ui-docs-window-client" }
loom = { git = "https://github.com/silk-lang/loom.git", rev = "afd5e368bfb9133df5a9e085d6c26499ca6f1928", path = "modules/loom", package = "loom" }
loom_tree = { git = "https://github.com/silk-lang/loom.git", rev = "afd5e368bfb9133df5a9e085d6c26499ca6f1928", path = "modules/loom/tree", package = "loom-tree" }
ui_tree = { git = "https://github.com/silk-lang/silkui.git", rev = "6abafabff55a95d0135587321c22a3e41c3e89e4", path = "modules/tree", package = "ui-tree" }
ui_tree_window = { git = "https://github.com/silk-lang/silkui.git", rev = "6abafabff55a95d0135587321c22a3e41c3e89e4", path = "modules/tree/window", package = "ui-tree-window" }
ui_fixtures = { git = "https://github.com/silk-lang/silkui.git", rev = "6abafabff55a95d0135587321c22a3e41c3e89e4", path = "modules/tree/fixtures", package = "ui-tree-fixtures" }
