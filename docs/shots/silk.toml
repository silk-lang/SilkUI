[package]
name = "ui-docs-shots"
description = "Draws the pictures the Silk UI docs show, from the example programs"
version = "0.1.0"
silk-version = "0.1.0-dev.74+205aea3f5b2e"
kind = "executable"

[dependencies]
examples = { path = "../examples", package = "ui-docs-examples" }
window_client = { git = "https://github.com/silk-lang/silkui.git", rev = "6628039760cf03da1d53eef54b7f4d51fa120493", path = "docs/examples/window", package = "ui-docs-window-client" }
loom = { git = "https://github.com/silk-lang/loom.git", rev = "6bf830fe9d7a8d0d02b2037801977430c5878c89", path = "modules/loom", package = "loom" }
loom_tree = { git = "https://github.com/silk-lang/loom.git", rev = "6bf830fe9d7a8d0d02b2037801977430c5878c89", path = "modules/loom/tree", package = "loom-tree" }
ui_tree = { git = "https://github.com/silk-lang/silkui.git", rev = "6628039760cf03da1d53eef54b7f4d51fa120493", path = "modules/tree", package = "ui-tree" }
ui_tree_window = { git = "https://github.com/silk-lang/silkui.git", rev = "6628039760cf03da1d53eef54b7f4d51fa120493", path = "modules/tree/window", package = "ui-tree-window" }
