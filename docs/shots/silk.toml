[package]
name = "ui-docs-shots"
description = "Draws the pictures the Silk UI docs show, from the example programs"
version = "0.1.0"
kind = "executable"

[dependencies]
examples = { path = "../examples", package = "ui-docs-examples" }
window_client = { git = "https://github.com/silk-lang/silkui.git", rev = "c3820a720cc62128c807e659d860c7f190db9631", path = "docs/examples/window", package = "ui-docs-window-client" }
loom = { git = "https://github.com/silk-lang/loom.git", rev = "54675109f92726b70941092fb4d64c5ae473ee0b", path = "modules/loom", package = "loom" }
loom_tree = { git = "https://github.com/silk-lang/loom.git", rev = "54675109f92726b70941092fb4d64c5ae473ee0b", path = "modules/loom/tree", package = "loom-tree" }
ui_tree = { git = "https://github.com/silk-lang/silkui.git", rev = "c3820a720cc62128c807e659d860c7f190db9631", path = "modules/tree", package = "ui-tree" }
ui_tree_window = { git = "https://github.com/silk-lang/silkui.git", rev = "c3820a720cc62128c807e659d860c7f190db9631", path = "modules/tree/window", package = "ui-tree-window" }
ui_fixtures = { git = "https://github.com/silk-lang/silkui.git", rev = "c3820a720cc62128c807e659d860c7f190db9631", path = "modules/tree/fixtures", package = "ui-tree-fixtures" }
ui_assets = { git = "https://github.com/silk-lang/silkui.git", rev = "c3820a720cc62128c807e659d860c7f190db9631", path = "modules/assets", package = "ui-assets" }
font_collection = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "f78c62feabd50b0f8cd444d97ec2f939bf8a9d9a", path = "modules/collection", package = "font-collection" }
codec = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "0c0b592f53afeb0b8fb2ab0552adf71df0267d0c", path = "modules/codec", package = "graphics-codec" }
vector = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "0c0b592f53afeb0b8fb2ab0552adf71df0267d0c", path = "modules/vector", package = "graphics-vector" }
svg_css = { git = "https://github.com/silk-lang/lib-css.git", rev = "f1589b2e9a909a7ff67b836585530a545021c591", path = "modules/style", package = "css-style" }
