[package]
name = "ui-docs-shots"
description = "Draws the pictures the Silk UI docs show, from the example programs"
version = "0.1.0"
silk-version = "0.1.0-dev.87+37fa5f8857de"
kind = "executable"

[dependencies]
examples = { path = "../examples", package = "ui-docs-examples" }
window_client = { git = "https://github.com/silk-lang/silkui.git", rev = "c3f45deb9dd01dcaa7d5324914c1523730914f74", path = "docs/examples/window", package = "ui-docs-window-client" }
loom = { git = "https://github.com/silk-lang/loom.git", rev = "4249e6c2f39d5f2c64dd6b4b31b864b0e14cb4e2", path = "modules/loom", package = "loom" }
loom_tree = { git = "https://github.com/silk-lang/loom.git", rev = "4249e6c2f39d5f2c64dd6b4b31b864b0e14cb4e2", path = "modules/loom/tree", package = "loom-tree" }
ui_tree = { git = "https://github.com/silk-lang/silkui.git", rev = "c3f45deb9dd01dcaa7d5324914c1523730914f74", path = "modules/tree", package = "ui-tree" }
ui_tree_window = { git = "https://github.com/silk-lang/silkui.git", rev = "c3f45deb9dd01dcaa7d5324914c1523730914f74", path = "modules/tree/window", package = "ui-tree-window" }
