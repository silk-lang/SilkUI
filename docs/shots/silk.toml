[package]
name = "ui-docs-shots"
description = "Draws the pictures the Silk UI docs show, from the example programs"
version = "0.1.0"
silk-version = "0.1.0-pipeline.1"
kind = "executable"

[dependencies]
examples = { path = "../examples", package = "ui-docs-examples" }
window_client = { git = "https://github.com/silk-lang/silkui.git", rev = "74dd232f1ad1bd5f7675cdaa2899afba81760a9f", path = "docs/examples/window", package = "ui-docs-window-client" }
loom = { git = "https://github.com/silk-lang/loom.git", rev = "b0d763e51924d934d754d0585877edbfd5b4178e", path = "modules/loom", package = "loom" }
loom_tree = { git = "https://github.com/silk-lang/loom.git", rev = "b0d763e51924d934d754d0585877edbfd5b4178e", path = "modules/loom/tree", package = "loom-tree" }
ui_tree = { git = "https://github.com/silk-lang/silkui.git", rev = "74dd232f1ad1bd5f7675cdaa2899afba81760a9f", path = "modules/tree", package = "ui-tree" }
ui_tree_window = { git = "https://github.com/silk-lang/silkui.git", rev = "74dd232f1ad1bd5f7675cdaa2899afba81760a9f", path = "modules/tree/window", package = "ui-tree-window" }
ui_fixtures = { git = "https://github.com/silk-lang/silkui.git", rev = "74dd232f1ad1bd5f7675cdaa2899afba81760a9f", path = "modules/tree/fixtures", package = "ui-tree-fixtures" }
ui_assets = { git = "https://github.com/silk-lang/silkui.git", rev = "74dd232f1ad1bd5f7675cdaa2899afba81760a9f", path = "modules/assets", package = "ui-assets" }
font_collection = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "ea3425ff6f35c387e532a7816d43e7fc6bfb1d4f", path = "modules/collection", package = "font-collection" }
codec = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "8e37c69b0b1bcbd56a3b0136d48ebe7e8606017e", path = "modules/codec", package = "graphics-codec" }
vector = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "8e37c69b0b1bcbd56a3b0136d48ebe7e8606017e", path = "modules/vector", package = "graphics-vector" }
