[package]
name = "ui-docs-shots"
description = "Draws the pictures the Silk UI docs show, from the example programs"
version = "0.1.0"
silk-version = "0.1.0-dev.74+205aea3f5b2e"
kind = "executable"

[dependencies]
examples = { path = "../examples", package = "ui-docs-examples" }
window_client = { git = "https://github.com/silk-lang/silkui.git", rev = "401469d3b0a5f114a9d651983a3ac1849ef52d06", path = "docs/examples/window", package = "ui-docs-window-client" }
loom = { git = "https://github.com/silk-lang/loom.git", rev = "cbffa181eb31664787f764581f6aeaadcbb19181", path = "modules/loom", package = "loom" }
loom_tree = { git = "https://github.com/silk-lang/loom.git", rev = "cbffa181eb31664787f764581f6aeaadcbb19181", path = "modules/loom/tree", package = "loom-tree" }
ui_tree = { git = "https://github.com/silk-lang/silkui.git", rev = "401469d3b0a5f114a9d651983a3ac1849ef52d06", path = "modules/tree", package = "ui-tree" }
ui_tree_window = { git = "https://github.com/silk-lang/silkui.git", rev = "401469d3b0a5f114a9d651983a3ac1849ef52d06", path = "modules/tree/window", package = "ui-tree-window" }
ui_fixtures = { git = "https://github.com/silk-lang/silkui.git", rev = "401469d3b0a5f114a9d651983a3ac1849ef52d06", path = "modules/tree/fixtures", package = "ui-tree-fixtures" }
