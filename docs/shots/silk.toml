[package]
name = "ui-docs-shots"
description = "Draws the pictures the Silk UI docs show, from the example programs"
version = "0.1.0"
kind = "executable"

[dependencies]
examples = { path = "../examples", package = "ui-docs-examples" }
window_client = { git = "https://github.com/silk-lang/silkui.git", rev = "8cb4c1daf670c7e121058bb1994362c1cf721dd7", path = "docs/examples/window", package = "ui-docs-window-client" }
loom = { git = "https://github.com/silk-lang/loom.git", rev = "0c929b7a3c6e6f631b0ce5c6d3be4e3881462cbb", path = "modules/loom", package = "loom" }
loom_tree = { git = "https://github.com/silk-lang/loom.git", rev = "0c929b7a3c6e6f631b0ce5c6d3be4e3881462cbb", path = "modules/loom/tree", package = "loom-tree" }
ui_tree = { git = "https://github.com/silk-lang/silkui.git", rev = "8cb4c1daf670c7e121058bb1994362c1cf721dd7", path = "modules/tree", package = "ui-tree" }
ui_tree_window = { git = "https://github.com/silk-lang/silkui.git", rev = "8cb4c1daf670c7e121058bb1994362c1cf721dd7", path = "modules/tree/window", package = "ui-tree-window" }
