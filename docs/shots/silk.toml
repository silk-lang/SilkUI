[package]
name = "ui-docs-shots"
description = "Draws the pictures the Silk UI docs show, from the example programs"
version = "0.1.0"
silk-version = "0.1.0-dev.74+205aea3f5b2e"
kind = "executable"

[dependencies]
examples = { path = "../examples", package = "ui-docs-examples" }
window_client = { path = "../examples/window", package = "ui-docs-window-client" }
loom = { git = "https://github.com/silk-lang/loom.git", rev = "63b4d0bfb8b6ac485c1c95cd99eff06e6a6649eb", path = "modules/loom", package = "loom" }
loom_tree = { git = "https://github.com/silk-lang/loom.git", rev = "63b4d0bfb8b6ac485c1c95cd99eff06e6a6649eb", path = "modules/loom/tree", package = "loom-tree" }
ui_tree = { path = "../../modules/tree", package = "ui-tree" }
ui_tree_window = { path = "../../modules/tree/window", package = "ui-tree-window" }
ui_fixtures = { path = "../../modules/tree/fixtures", package = "ui-tree-fixtures" }
ui_assets = { path = "../../modules/assets", package = "ui-assets" }
font_collection = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "7667e203b385ba0d0d704f88a9cd37b1859148a6", path = "modules/collection", package = "font-collection" }
codec = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "1ba6e77674b908b534db11b9654dd0e7539a8bac", path = "modules/codec", package = "graphics-codec" }
vector = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "1ba6e77674b908b534db11b9654dd0e7539a8bac", path = "modules/vector", package = "graphics-vector" }
