[package]
name = "ui-docs-site"
description = "The Silk UI docs: a Silk UI program, drawn ahead of time and hydrated in the page"
version = "0.1.0"
silk-version = "0.1.0-pipeline.1"
kind = "executable"

[dependencies]
loom = { git = "https://github.com/silk-lang/loom.git", rev = "b0d763e51924d934d754d0585877edbfd5b4178e", path = "modules/loom", package = "loom" }
loom_dom = { git = "https://github.com/silk-lang/loom.git", rev = "b0d763e51924d934d754d0585877edbfd5b4178e", path = "modules/loom/dom", package = "loom-dom" }
examples = { path = "examples", package = "ui-docs-examples" }
