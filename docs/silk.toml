kind = "executable"

[dependencies]
loom = { git = "https://github.com/silk-lang/loom.git", rev = "e5fa26938c44d00f24ced7b7a9cd3fe36ffc9a3e", path = "modules/loom", package = "loom" }
loom_dom = { git = "https://github.com/silk-lang/loom.git", rev = "e5fa26938c44d00f24ced7b7a9cd3fe36ffc9a3e", path = "modules/loom/dom", package = "loom-dom" }
examples = { path = "examples", package = "ui-docs-examples" }
