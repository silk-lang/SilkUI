[package]
name = "ui-docs-site"
description = "The Silk UI docs: a Silk UI program, drawn ahead of time and hydrated in the page"
version = "0.1.0"
kind = "executable"

[dependencies]
loom = { git = "https://github.com/silk-lang/loom.git", rev = "ce47e4f830a7e600b717474d07135755ce19c0fe", path = "modules/loom", package = "loom" }
loom_dom = { git = "https://github.com/silk-lang/loom.git", rev = "ce47e4f830a7e600b717474d07135755ce19c0fe", path = "modules/loom/dom", package = "loom-dom" }
examples = { path = "examples", package = "ui-docs-examples" }
