[package]
name = "ui-docs-site"
description = "The Silk UI docs: a Silk UI program, drawn ahead of time and hydrated in the page"
version = "0.1.0"
kind = "executable"

[dependencies]
loom = { git = "https://github.com/silk-lang/loom.git", rev = "54675109f92726b70941092fb4d64c5ae473ee0b", path = "modules/loom", package = "loom" }
loom_dom = { git = "https://github.com/silk-lang/loom.git", rev = "54675109f92726b70941092fb4d64c5ae473ee0b", path = "modules/loom/dom", package = "loom-dom" }
examples = { path = "examples", package = "ui-docs-examples" }
