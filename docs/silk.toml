[package]
name = "ui-docs-site"
description = "The Silk UI docs: a Silk UI program, drawn ahead of time and hydrated in the page"
version = "0.1.0"
silk-version = "0.1.0-dev.85+45b9e51824ca"
kind = "executable"

[dependencies]
loom = { git = "https://github.com/silk-lang/loom.git", rev = "3922c3b700bd20185ff57173ce293d3a41cb100c", path = "modules/loom", package = "loom" }
loom_dom = { git = "https://github.com/silk-lang/loom.git", rev = "3922c3b700bd20185ff57173ce293d3a41cb100c", path = "modules/loom/dom", package = "loom-dom" }
examples = { path = "examples", package = "ui-docs-examples" }
