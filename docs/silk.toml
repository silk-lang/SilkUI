[package]
name = "ui-docs-site"
description = "The Silk UI docs: a Silk UI program, drawn ahead of time and hydrated in the page"
version = "0.1.0"
silk-version = "0.1.0-dev.74+205aea3f5b2e"
kind = "executable"

[dependencies]
loom = { git = "https://github.com/silk-lang/loom.git", rev = "960cc082f0cf8af6fbefaa41e5e2a706ed7df74b", path = "modules/loom", package = "loom" }
loom_dom = { git = "https://github.com/silk-lang/loom.git", rev = "960cc082f0cf8af6fbefaa41e5e2a706ed7df74b", path = "modules/loom/dom", package = "loom-dom" }
examples = { path = "examples", package = "ui-docs-examples" }
