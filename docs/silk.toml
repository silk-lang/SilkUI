loom_dom = { git = "https://github.com/silk-lang/loom.git", rev = "07d85a80588b042f2adc630a27779255ae663575", path = "modules/loom/dom", package = "loom-dom" }
examples = { path = "examples", package = "ui-docs-examples" }
