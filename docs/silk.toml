loom_dom = { git = "https://github.com/silk-lang/loom.git", rev = "8e0145123e949d79f9def09ea990cb9bda4803d7", path = "modules/loom/dom", package = "loom-dom" }
examples = { path = "examples", package = "ui-docs-examples" }
