[package]
name = "ui-docs-examples"
description = "Every example program the Silk UI docs show, compiled and tested"
version = "0.1.0"
silk-version = "0.1.0-dev.74+205aea3f5b2e"
kind = "library"
exports = ["lib", "core.counter", "core.look", "core.menu", "core.todo", "core.dice", "core.stopwatch", "core.pages", "core.order", "core.plans", "core.album", "showcase.board", "focus.look", "focus.step1", "focus.step2", "focus.step3", "focus.step4", "tree.picture", "tree.card", "tree.clicker", "tree.field", "tree.remote", "native.pad", "native.swatches", "native.search"]

[dependencies]
loom = { git = "https://github.com/silk-lang/loom.git", rev = "c848a47ed929f19235c4096d11eef92c7acbf2cc", path = "modules/loom", package = "loom" }
ui_tree = { git = "https://github.com/silk-lang/silkui.git", rev = "6afba0e7c14a824759c9a0fa9e2b0db660b2734f", path = "modules/tree", package = "ui-tree" }
codec = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "7e3770cb41beaf709272548863f5b020f476765f", path = "modules/codec", package = "graphics-codec" }
vector = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "7e3770cb41beaf709272548863f5b020f476765f", path = "modules/vector", package = "graphics-vector" }
