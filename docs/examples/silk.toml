[package]
name = "ui-docs-examples"
description = "Every example program the Silk UI docs show, compiled and tested"
version = "0.1.0"
silk-version = "0.1.0-dev.74+205aea3f5b2e"
kind = "library"
exports = ["lib", "core.counter", "core.look", "core.menu", "core.todo", "core.dice", "core.stopwatch", "core.pages", "core.order", "core.plans", "core.plans_sheet", "core.plans_css", "core.plans_tailwind", "core.inbox_tailwind", "core.album", "showcase.board", "focus.look", "focus.step1", "focus.step2", "focus.step3", "focus.step4", "tree.picture", "tree.card", "tree.clicker", "tree.field", "tree.remote", "native.pad", "native.swatches", "native.search"]

[dependencies]
loom = { git = "https://github.com/silk-lang/loom.git", rev = "134d64f349c0b0a70cb414e87fdc977a057c7959", path = "modules/loom", package = "loom" }
ui_tree = { git = "https://github.com/silk-lang/silkui.git", rev = "42cfb68add531e9595954b367e97f209c125fe0a", path = "modules/tree", package = "ui-tree" }
codec = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "5493dad76ae44659f854d7abdccd3a00010fd6a3", path = "modules/codec", package = "graphics-codec" }
vector = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "5493dad76ae44659f854d7abdccd3a00010fd6a3", path = "modules/vector", package = "graphics-vector" }
