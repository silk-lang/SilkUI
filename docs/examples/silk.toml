[package]
name = "ui-docs-examples"
description = "Every example program the Silk UI docs show, compiled and tested"
version = "0.1.0"
kind = "library"
exports = ["lib", "core.counter", "core.look", "core.menu", "core.todo", "core.dice", "core.stopwatch", "core.pages", "core.order", "core.plans", "core.plans_sheet", "core.plans_css", "core.plans_tailwind", "core.inbox_tailwind", "core.album", "showcase.board", "focus.look", "focus.step1", "focus.step2", "focus.step3", "focus.step4", "tree.picture", "tree.card", "tree.clicker", "tree.field", "tree.remote", "native.pad", "native.swatches", "native.search"]

[dependencies]
loom = { git = "https://github.com/silk-lang/loom.git", rev = "95bf99902b533f4e59e12fa25c4422a8bbe4fca3", path = "modules/loom", package = "loom" }
ui_tree = { git = "https://github.com/silk-lang/silkui.git", rev = "d3fcc84cfb5ee4f547bcbb0259afe3f5c7970c0f", path = "modules/tree", package = "ui-tree" }
codec = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "facc2e7a0ce15bb1eeb8bc9e35c91351f329bb4f", path = "modules/codec", package = "graphics-codec" }
vector = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "facc2e7a0ce15bb1eeb8bc9e35c91351f329bb4f", path = "modules/vector", package = "graphics-vector" }
