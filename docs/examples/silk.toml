[package]
name = "ui-docs-examples"
description = "Every example program the Silk UI docs show, compiled and tested"
version = "0.1.0"
silk-version = "0.1.0-dev.87+37fa5f8857de"
kind = "library"
exports = ["lib", "core.counter", "core.look", "core.menu", "core.todo", "core.dice", "core.stopwatch", "core.pages", "core.order", "core.plans", "core.plans_sheet", "core.plans_css", "core.plans_tailwind", "core.inbox_tailwind", "core.album", "showcase.board", "focus.look", "focus.step1", "focus.step2", "focus.step3", "focus.step4", "tree.picture", "tree.card", "tree.clicker", "tree.field", "tree.remote", "native.pad", "native.swatches", "native.search"]

[dependencies]
loom = { git = "https://github.com/silk-lang/loom.git", rev = "147384800c96659a1d25a602ec93f00cdc5cbe8c", path = "modules/loom", package = "loom" }
ui_tree = { git = "https://github.com/silk-lang/silkui.git", rev = "f10baccc316420750a384a822c6c2d08355fc531", path = "modules/tree", package = "ui-tree" }
codec = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "5352021805b6515f069ee41fa6a52f4bf1ec8157", path = "modules/codec", package = "graphics-codec" }
vector = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "5352021805b6515f069ee41fa6a52f4bf1ec8157", path = "modules/vector", package = "graphics-vector" }
