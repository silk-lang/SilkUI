description = "The album from the Silk UI guide in a native window: photos, icons and fonts of its own"
version = "0.1.0"
kind = "executable"

[dependencies]
loom = { git = "https://github.com/silk-lang/loom.git", rev = "95bf99902b533f4e59e12fa25c4422a8bbe4fca3", path = "modules/loom", package = "loom" }
loom_window = { git = "https://github.com/silk-lang/loom.git", rev = "95bf99902b533f4e59e12fa25c4422a8bbe4fca3", path = "modules/loom/window", package = "loom-window" }
examples = { path = "../..", package = "ui-docs-examples" }
