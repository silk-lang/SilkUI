kind = "executable"

[dependencies]
loom = { git = "https://github.com/silk-lang/loom.git", rev = "c0fe9c341c46f4c3d9afbdfbf2fed2170597ed9e", path = "modules/loom", package = "loom" }
loom_window = { git = "https://github.com/silk-lang/loom.git", rev = "c0fe9c341c46f4c3d9afbdfbf2fed2170597ed9e", path = "modules/loom/window", package = "loom-window" }
examples = { path = "../..", package = "ui-docs-examples" }
