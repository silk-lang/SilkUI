[package]
name = "album"
description = "The album from the Silk UI guide in a native window: photos, icons and fonts of its own"
version = "0.1.0"
silk-version = "0.1.0-pipeline.1"
kind = "executable"

[dependencies]
loom = { git = "https://github.com/silk-lang/loom.git", rev = "b0d763e51924d934d754d0585877edbfd5b4178e", path = "modules/loom", package = "loom" }
loom_window = { git = "https://github.com/silk-lang/loom.git", rev = "b0d763e51924d934d754d0585877edbfd5b4178e", path = "modules/loom/window", package = "loom-window" }
examples = { path = "../..", package = "ui-docs-examples" }
