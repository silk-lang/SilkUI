[package]
name = "tree-window"
description = "A UI tree in a native window, with no framework"
version = "0.1.0"
silk-version = "0.1.0-pipeline.1"
kind = "executable"

[dependencies]
window_client = { path = "../../window", package = "ui-docs-window-client" }
ui_tree = { path = "../../../../modules/tree", package = "ui-tree" }
ui_tree_window = { path = "../../../../modules/tree/window", package = "ui-tree-window" }
ui_fixtures = { path = "../../../../modules/tree/fixtures", package = "ui-tree-fixtures" }
ui_inspect_server = { path = "../../../../modules/inspect/server", package = "ui-inspect-server" }
window = { git = "https://github.com/silk-lang/lib-native.git", rev = "8b411d1f2e4848a6a93d5cf26b488cd52db64069", path = "modules/platform/window", package = "platform-window" }
webgpu = { git = "https://github.com/silk-lang/lib-native.git", rev = "8b411d1f2e4848a6a93d5cf26b488cd52db64069", path = "modules/gpu/webgpu", package = "gpu-webgpu" }
atlas = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "4a90de327acd6f62d060019ab49dba5490262f69", path = "modules/atlas", package = "graphics-atlas" }
vector = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "4a90de327acd6f62d060019ab49dba5490262f69", path = "modules/vector", package = "graphics-vector" }
