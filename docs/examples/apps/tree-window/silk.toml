[package]
name = "tree-window"
description = "A UI tree in a native window, with no framework"
version = "0.1.0"
silk-version = "0.1.0-dev.74+205aea3f5b2e"
kind = "executable"

[dependencies]
window_client = { path = "../../window", package = "ui-docs-window-client" }
ui_tree = { path = "../../../../modules/tree", package = "ui-tree" }
ui_tree_window = { path = "../../../../modules/tree/window", package = "ui-tree-window" }
ui_fixtures = { path = "../../../../modules/tree/fixtures", package = "ui-tree-fixtures" }
ui_inspect_server = { path = "../../../../modules/inspect/server", package = "ui-inspect-server" }
window = { git = "https://github.com/silk-lang/lib-native.git", rev = "b40277a5a58d7ddf679cff350e8ee0f02388ef3f", path = "modules/platform/window", package = "platform-window" }
webgpu = { git = "https://github.com/silk-lang/lib-native.git", rev = "b40277a5a58d7ddf679cff350e8ee0f02388ef3f", path = "modules/gpu/webgpu", package = "gpu-webgpu" }
atlas = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "1ba6e77674b908b534db11b9654dd0e7539a8bac", path = "modules/atlas", package = "graphics-atlas" }
vector = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "1ba6e77674b908b534db11b9654dd0e7539a8bac", path = "modules/vector", package = "graphics-vector" }
