[package]
name = "tree-hello"
description = "A UI tree drawn to a PNG file, with no window"
version = "0.1.0"
kind = "executable"

[dependencies]
ui_tree = { path = "../../../../modules/tree", package = "ui-tree" }
ui_assets = { path = "../../../../modules/assets", package = "ui-assets" }
font_collection = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "aaaf14f23a6a764edaf999962cf173554fbe6141", path = "modules/collection", package = "font-collection" }
codec = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "c5fc48eb37e06b217ac96effa7801866e46f90ed", path = "modules/codec", package = "graphics-codec" }
vector = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "c5fc48eb37e06b217ac96effa7801866e46f90ed", path = "modules/vector", package = "graphics-vector" }
