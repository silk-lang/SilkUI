[package]
name = "tree-hello"
description = "A UI tree drawn to a PNG file, with no window"
version = "0.1.0"
kind = "executable"

[dependencies]
ui_tree = { path = "../../../../modules/tree", package = "ui-tree" }
ui_assets = { path = "../../../../modules/assets", package = "ui-assets" }
font_collection = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "53e19890b15225d7c7bd211490447c6ad264e4a0", path = "modules/collection", package = "font-collection" }
codec = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "599e1f1c800843069678610db7a17f764a41b3d5", path = "modules/codec", package = "graphics-codec" }
vector = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "599e1f1c800843069678610db7a17f764a41b3d5", path = "modules/vector", package = "graphics-vector" }
