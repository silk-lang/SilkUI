[package]
name = "pad"
description = "A one-note editor with a menu bar, file dialogs and the clipboard"
version = "0.1.0"
kind = "executable"

[dependencies]
loom = { git = "https://github.com/silk-lang/loom.git", rev = "750d006a5d0b98e2fe035e4ee0557afae13c414c", path = "modules/loom", package = "loom" }
loom_window = { git = "https://github.com/silk-lang/loom.git", rev = "750d006a5d0b98e2fe035e4ee0557afae13c414c", path = "modules/loom/window", package = "loom-window" }
examples = { path = "../..", package = "ui-docs-examples" }
