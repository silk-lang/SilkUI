[package]
name = "pad"
description = "A one-note editor with a menu bar, file dialogs and the clipboard"
version = "0.1.0"
kind = "executable"

[dependencies]
loom = { git = "https://github.com/silk-lang/loom.git", rev = "4b5543c4c7ca421b363e707a9a22803591ed1c65", path = "modules/loom", package = "loom" }
loom_window = { git = "https://github.com/silk-lang/loom.git", rev = "4b5543c4c7ca421b363e707a9a22803591ed1c65", path = "modules/loom/window", package = "loom-window" }
examples = { path = "../..", package = "ui-docs-examples" }
