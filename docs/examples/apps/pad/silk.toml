[package]
name = "pad"
description = "A one-note editor with a menu bar, file dialogs and the clipboard"
version = "0.1.0"
silk-version = "0.1.0-dev.74+205aea3f5b2e"
kind = "executable"

[dependencies]
loom = { git = "https://github.com/silk-lang/loom.git", rev = "ed8cc733a678e549513bb23635730416cd0d5ee3", path = "modules/loom", package = "loom" }
loom_window = { git = "https://github.com/silk-lang/loom.git", rev = "ed8cc733a678e549513bb23635730416cd0d5ee3", path = "modules/loom/window", package = "loom-window" }
examples = { path = "../..", package = "ui-docs-examples" }
