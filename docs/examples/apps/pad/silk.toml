[package]
name = "pad"
description = "A one-note editor with a menu bar, file dialogs and the clipboard"
version = "0.1.0"
silk-version = "0.1.0-dev.87+37fa5f8857de"
kind = "executable"

[dependencies]
loom = { git = "https://github.com/silk-lang/loom.git", rev = "4249e6c2f39d5f2c64dd6b4b31b864b0e14cb4e2", path = "modules/loom", package = "loom" }
loom_window = { git = "https://github.com/silk-lang/loom.git", rev = "4249e6c2f39d5f2c64dd6b4b31b864b0e14cb4e2", path = "modules/loom/window", package = "loom-window" }
examples = { path = "../..", package = "ui-docs-examples" }
