description = "Tests for the example programs the Silk UI docs show"
version = "0.1.0"
silk-version = "0.1.0-dev.74+205aea3f5b2e"
main = "tests.silk"
kind = "library"

[dependencies]
examples = { path = "../examples", package = "ui-docs-examples" }
