loom_dom = { git = "https://github.com/silk-lang/loom.git", rev = "0d0d6030182e8b50cf5a4c0f231ec4f773b55703", path = "modules/loom/dom", package = "loom-dom" }
ui_tree = { git = "https://github.com/silk-lang/silkui.git", rev = "3c71534617b65cedbd45aafe12b9fb8373f52e3e", path = "modules/tree", package = "ui-tree" }
ui_fixtures = { git = "https://github.com/silk-lang/silkui.git", rev = "3c71534617b65cedbd45aafe12b9fb8373f52e3e", path = "modules/tree/fixtures", package = "ui-tree-fixtures" }
