[package]
name = "ui-docs-tests"
description = "Tests for the example programs the Silk UI docs show"
version = "0.1.0"
silk-version = "0.1.0-pipeline.1"
main = "tests.silk"
kind = "library"

[dependencies]
examples = { path = "../examples", package = "ui-docs-examples" }
loom = { git = "https://github.com/silk-lang/loom.git", rev = "c8d7c61d969c88b2262f281841e8b099e5f9c760", path = "modules/loom", package = "loom" }
loom_tree = { git = "https://github.com/silk-lang/loom.git", rev = "c8d7c61d969c88b2262f281841e8b099e5f9c760", path = "modules/loom/tree", package = "loom-tree" }
loom_dom = { git = "https://github.com/silk-lang/loom.git", rev = "c8d7c61d969c88b2262f281841e8b099e5f9c760", path = "modules/loom/dom", package = "loom-dom" }
ui_tree = { path = "../../modules/tree", package = "ui-tree" }
ui_fixtures = { path = "../../modules/tree/fixtures", package = "ui-tree-fixtures" }
