name: UI
# Linux runs everything. macOS and Windows run one job each with only what differs there:
# the window hosts, the accessibility adapters and linking. Loom, the DevTools and the
# terminal are tested in silk-lang/loom.
# ui-full.yml runs the complete suite on every platform nightly.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  packages:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Linux window headers
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbcommon-dev libwayland-dev wayland-protocols
      - uses: ./.github/actions/setup-silk
      - name: Provision pinned LLVM and native tools
        run: silk task setup-ci
      - name: Every package, tests, HTTP images, goldens and wasm API checks
        run: silk task check
      - name: JavaScript package tests and example bundles
        working-directory: modules/js
        run: npm ci && npm test && npm run build
      - name: Bundled examples on the embedded engine
        run: silk test --manifest-path modules/js/examples/tests/silk.toml --root src/tests.silk
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-package-failures
          path: |
            build/test-results
            modules/**/actual*
  native:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux window hosts
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbcommon-dev libwayland-dev wayland-protocols xvfb xauth weston
      - uses: ./.github/actions/setup-silk
      - run: silk task setup-ci --linux-gpu
      # Debug builds: a release build of each demo takes four minutes, and ui-full.yml makes them.
      - name: Window demos on X11 and Wayland
        run: |
          for demo in tree/demo tree/window/demo tree/window/examples/gpu-canvas js/demo; do
            silk task native demo "modules/$demo" -- check
          done
          # WebGPU from JavaScript: a triangle in a canvas, read back through mapAsync.
          silk task native demo modules/js/demo -- check --entry modules/js/examples/webgpu-canvas/app.js
          # Canvas 2D from JavaScript: text, shapes and an image, read back with getImageData.
          silk task native demo modules/js/demo -- check --entry modules/js/examples/canvas2d/app.js
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # three.js's WebGPU renderer, bundled by Vite as an application would be.
      - name: three.js in a canvas
        run: |
          npm ci --prefix modules/js
          npm run build --prefix modules/js/examples/three-canvas
          silk task native demo modules/js/demo -- check --entry modules/js/examples/three-canvas/dist/app.js
      - name: Inspector and MCP
        run: |
          silk task native inspect
          silk task native mcp
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-inspector-Linux
          path: .cache/ui-inspect/*.png
          if-no-files-found: ignore
  macos:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-silk
      - name: Provision pinned LLVM and native tools
        run: silk task setup-ci
      - name: Accessibility adapter and window host tests
        run: |
          for tests in accesskit/macos tree/window/tests; do
            silk test --manifest-path "modules/$tests/silk.toml" --root src/tests.silk
          done
      - name: Window demos
        run: |
          for demo in tree/demo tree/window/demo js/demo; do
            silk task native demo "modules/$demo" -- check
          done
      - name: Web views
        run: |
          silk run --manifest-path modules/webview/tests/native/silk.toml
          silk task native demo modules/js/demo -- modules/js/examples/webview-check/app.js
      - name: Inspector and MCP
        run: |
          silk task native inspect
          silk task native mcp
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-inspector-macOS
          path: .cache/ui-inspect/*.png
          if-no-files-found: ignore
  # Managed HTTP/native fixtures and window checks require silk-lang/silk#3034 on Windows.
  # Checking the whole workspace takes over ten minutes here; ui-full.yml does it.
  windows:
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: ./.github/actions/setup-silk
      - name: Provision pinned LLVM and native tools
        run: silk task setup-ci
      - name: Accessibility adapter tests
        run: silk test --manifest-path modules/accesskit/windows/silk.toml --root src/tests.silk
      # silk test starts a test with only SystemRoot set, so the GPU DLLs setup-ci puts on PATH
      # must sit beside the test program.
      - name: GPU runtime DLLs beside the tests
        run: |
          $dev = 'build/x86_64-pc-windows-msvc/dev'
          New-Item -ItemType Directory -Force $dev | Out-Null
          foreach ($name in 'nonstd_dawn.dll', 'dxcompiler.dll', 'dxil.dll', 'glfw3.dll') {
            Copy-Item (where.exe $name | Select-Object -First 1) $dev
          }
      - name: Tree window host tests
        run: silk test --manifest-path modules/tree/window/tests/silk.toml --root src/tests.silk
      - name: Inspector socket tests
        run: silk test --manifest-path modules/inspect/server/tests/silk.toml --root src/tests.silk
      - name: Tools link
        run: silk task build-tools
  node:
    # Exercise the runtime-backed realm separately from the embedded-engine tests.
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Linux window headers
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbcommon-dev libwayland-dev wayland-protocols
      - uses: ./.github/actions/setup-silk
      - name: Provision pinned LLVM and native tools
        run: silk task setup-ci
      # Silk builds the runtime's pinned native sources; no prepare script or system archives.
      - name: Network check
        run: |
          silk build --manifest-path modules/js/node/tests/silk.toml --progress plain
          python3 modules/js/node/scripts/check modules/js/node/tests/build/x86_64-unknown-linux-gnu/dev/ui-js-node-check
  browser:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbcommon-dev libwayland-dev wayland-protocols xvfb xauth
      - uses: ./.github/actions/setup-silk
      - name: Provision Vulkan and select existing Chromium
        run: silk task setup-ci --browser --linux-gpu
      # Ubuntu's AppArmor profile denies unprivileged user namespaces, which Chromium's sandbox
      # needs. Without this Chromium aborts at startup with "No usable sandbox".
      - name: Allow the Chromium sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # The first Chromium start on a fresh runner reads the browser and its fonts from a cold disk,
      # which has taken over 30 seconds. Pay for it here, timed, rather than inside a CDP request.
      - name: Warm up Chromium
        run: time timeout 300 "$CHROMIUM_EXECUTABLE" --headless=new --password-store=basic --user-data-dir="$(mktemp -d)" --dump-dom about:blank > /dev/null
      - name: Chrome text, GPU fixtures and real browser input
        run: |
          silk test --manifest-path silk.toml --root src/task_browser_server.silk
          silk task browser check
