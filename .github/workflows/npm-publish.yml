name: npm publish
# Publishes the @silkui packages from modules/js/packages to npm, started by hand.
# It uses npm trusted publishing (OIDC), so there is no npm token: each package names this
# file as its trusted publisher on npmjs.com. A version that is already on npm is skipped,
# so a release is: bump the versions, merge, run this workflow with "publish" ticked.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to npm (unticked runs the tests and a dry run only)
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
concurrency:
  group: npm-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest
      - name: Package tests
        working-directory: modules/js
        run: npm ci && npm test
      - name: Publish what npm does not have yet
        working-directory: modules/js
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          # @silkui/core first: the others depend on its exact version.
          for dir in core react foldkit vite; do
            name=$(node -p "require('./packages/$dir/package.json').name")
            version=$(node -p "require('./packages/$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "skip $name@$version (already on npm)"
            elif [ "$PUBLISH" = "true" ]; then
              npm publish "./packages/$dir" --access public
            else
              npm publish "./packages/$dir" --access public --dry-run
            fi
          done
