name: Windows diagnose (temporary)
on:
  push:
    branches: [claude/project-thread-whbi2f]
jobs:
  windows:
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: ./.github/actions/setup-silk
      - name: Provision pinned LLVM and native tools
        run: silk task setup-ci
      - name: Build tree window tests
        run: |
          silk test --manifest-path modules/accesskit/windows/silk.toml --root src/tests.silk 2>&1 | Select-Object -Last 5
          silk test --manifest-path modules/tree/window/tests/silk.toml --root src/tests.silk --no-cache 2>&1 | Select-String -NotMatch '^  (load|cache|check|codegen|borrow|link) '
          "silk exit: $LASTEXITCODE"
          exit 0
      - name: Trace the test exe that silk test starts
        run: |
          $script = 'D:\a\_temp\child.txt'
          @'
          bp ntdll!NtCreateFile "dS poi(@r8+10); gu; r rax; g"
          bp ntdll!NtOpenFile "dS poi(@r8+10); gu; r rax; g"
          bp ntdll!NtQueryAttributesFile "dS poi(@rcx+10); gu; r rax; g"
          bp ntdll!NtQueryFullAttributesFile "dS poi(@rcx+10); gu; r rax; g"
          bp ntdll!NtReadFile "r rcx, rdx; gu; r rax; g"
          bp ntdll!NtWriteFile "r rcx; gu; r rax; g"
          bp ntdll!NtQueryInformationFile "r rcx, r9; gu; r rax; g"
          bp ntdll!RtlExitUserProcess "r rcx; k 20; g"
          g
          '@ | Set-Content $script
          Get-Content $script
          $cdb = 'C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe'
          $ifeo = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\ui-tree-window-tests-tests.exe'
          New-Item -Force $ifeo | Out-Null
          Set-ItemProperty $ifeo -Name Debugger -Value "`"$cdb`" -G -cf $script -logo D:\a\_temp\cdb.log"
          silk test --manifest-path modules/tree/window/tests/silk.toml --root src/tests.silk 2>&1 | Select-String -NotMatch '^  (load|cache|check|codegen|borrow|link) ' | Select-Object -Last 40
          "silk exit: $LASTEXITCODE"
          Remove-Item -Force $ifeo
          Get-Content D:\a\_temp\cdb.log -ErrorAction SilentlyContinue | Select-String -NotMatch 'NatVis|ModLoad|Whitespace at start|commands were skipped|^\s*$' | Select-Object -Last 400
          exit 0
