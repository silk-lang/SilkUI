name: Windows diagnose (temporary)
on:
  push:
    branches: [claude/project-thread-whbi2f]
jobs:
  windows:
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: ./.github/actions/setup-silk
      - name: Provision pinned LLVM and native tools
        run: silk task setup-ci
      - name: Build tree window tests
        run: |
          silk test --manifest-path modules/accesskit/windows/silk.toml --root src/tests.silk 2>&1 | Select-Object -Last 5
          silk test --manifest-path modules/tree/window/tests/silk.toml --root src/tests.silk --no-cache 2>&1 | Select-String -NotMatch '^  (load|cache|check|codegen|borrow|link) '
          "silk exit: $LASTEXITCODE"
          exit 0
      - name: Run the test exe under cdb
        run: |
          $exe = 'D:/a/SilkUI/SilkUI/build/x86_64-pc-windows-msvc/dev/ui-tree-window-tests-tests.exe'
          Get-ChildItem 'D:/a/SilkUI/SilkUI/build/x86_64-pc-windows-msvc/dev/' | Where-Object Name -like 'ui-tree-window-tests-tests*' | Format-Table Name,Length
          dumpbin /headers $exe | Select-String 'entry point|subsystem'
          dumpbin /dependents $exe | Select-String '\.dll'
          $args1 = @('--silk-test-plan', "/$exe.plan", '--silk-test-result', "/$exe.receipt", '--silk-test-progress', "/$exe.progress", '--silk-test-timeout', '60')
          & $exe @args1
          "direct exit: $LASTEXITCODE"
          $cdb = Get-ChildItem 'C:/Program Files (x86)/Windows Kits/10/Debuggers/x64/cdb.exe' -ErrorAction SilentlyContinue
          "cdb: $cdb"
          if ($cdb) {
            $cmds = '.symfix+ D:\a\_temp\sym; .reload /f ntdll.dll; bp ntdll!NtCreateFile "dS poi(@r8+10); gu; r rax; g"; bp ntdll!NtOpenFile "dS poi(@r8+10); gu; r rax; g"; bp ntdll!NtQueryAttributesFile "dS poi(@rcx+10); gu; r rax; g"; bp ntdll!NtQueryFullAttributesFile "dS poi(@rcx+10); gu; r rax; g"; bp ntdll!NtReadFile "r rcx; gu; r rax; g"; bp ntdll!NtWriteFile "r rcx; gu; r rax; g"; bp ntdll!RtlExitUserProcess "r rcx; k 20; q"; g'
            & $cdb.FullName -G -c $cmds $exe @args1 2>&1 | Select-String -NotMatch 'NatVis|ModLoad' | Select-Object -Last 300
          }
          exit 0
