name: Windows diagnose (temporary)
on:
  push:
    branches: [claude/project-thread-whbi2f]
jobs:
  windows:
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: ./.github/actions/setup-silk
      - name: Provision pinned LLVM and native tools
        run: silk task setup-ci
      - name: Bisect tree window tests
        run: |
          silk --version
          foreach ($name in @('nothingMatchesThis', 'cssCursorImages', 'loaderServesUrls', 'loaderServesFontFaces', 'loaderServesFontStylesheets', 'stylesheetRulesBecomeTreeRules', 'aDebugBuildReloadsEditedImageFiles', 'runtimeStylesheetsKeepOrderAndRejectStaleLoads', 'runtimeStylesheetsReadFilesAndKeepStylesAfterIoFailure', 'theScreenReaderRunsBesideTheApp', 'compiledUpdatesAreAtomicRootScopedAndRecoverable', 'windowEventsDriveTheTree', 'textInputImeAndClipboardThroughTheAdapter', 'queuedPointerAndWheelEventsCoalesce')) {
            silk test --manifest-path modules/tree/window/tests/silk.toml --root src/tests.silk --filter $name 2>&1 | Select-String -NotMatch '^  (load|cache|check|codegen|borrow|link) '
            "== $name exit: $LASTEXITCODE"
          }
          exit 0
