name: Windows diagnose (temporary)
on:
  push:
    branches: [claude/project-thread-whbi2f]
jobs:
  windows:
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: ./.github/actions/setup-silk
      - name: Provision pinned LLVM and native tools
        run: silk task setup-ci
      - name: Put the GPU runtime DLLs beside the test programs
        run: |
          $dev = 'build/x86_64-pc-windows-msvc/dev'
          New-Item -ItemType Directory -Force $dev | Out-Null
          foreach ($name in 'nonstd_dawn.dll', 'dxcompiler.dll', 'dxil.dll', 'glfw3.dll') {
            Copy-Item (where.exe $name | Select-Object -First 1) $dev
          }
          Get-ChildItem $dev
      - name: Tree window host tests
        run: silk test --manifest-path modules/tree/window/tests/silk.toml --root src/tests.silk
