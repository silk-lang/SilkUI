name: Windows diagnose (temporary)
on:
  push:
    branches: [claude/project-thread-whbi2f]
jobs:
  windows:
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: ./.github/actions/setup-silk
      - name: Provision pinned LLVM and native tools
        run: silk task setup-ci
      - name: Build tree window tests
        run: |
          silk test --manifest-path modules/accesskit/windows/silk.toml --root src/tests.silk 2>&1 | Select-Object -Last 5
          silk test --manifest-path modules/tree/window/tests/silk.toml --root src/tests.silk --no-cache 2>&1 | Select-String -NotMatch '^  (load|cache|check|codegen|borrow|link) '
          "silk exit: $LASTEXITCODE"
          exit 0
      - name: Trace the test exe that silk test starts
        run: |
          $script = 'D:\a\_temp\child.txt'
          @'
          bp ntdll!NtCreateFile "dS poi(@r8+10); gu; r rax; g"
          bp ntdll!NtOpenFile "dS poi(@r8+10); gu; r rax; g"
          bp ntdll!NtQueryAttributesFile "dS poi(@rcx+10); gu; r rax; g"
          bp ntdll!NtQueryFullAttributesFile "dS poi(@rcx+10); gu; r rax; g"
          bp ntdll!NtReadFile "r rcx, rdx; gu; r rax; g"
          bp ntdll!NtWriteFile "r rcx; gu; r rax; g"
          bp ntdll!NtQueryInformationFile "r rcx, r9; gu; r rax; g"
          bp ntdll!RtlExitUserProcess "r rcx; k 20; g"
          g
          '@ | Set-Content $script
          $dev = 'D:\a\SilkUI\SilkUI\build\x86_64-pc-windows-msvc\dev'
          @'
          @echo off
          echo %* > D:\a\_temp\args.txt
          copy /y D:\a\SilkUI\SilkUI\build\x86_64-pc-windows-msvc\dev\ui-tree-window-tests-tests.exe.plan D:\a\_temp\saved.plan > nul
          copy /y D:\a\SilkUI\SilkUI\build\x86_64-pc-windows-msvc\dev\ui-tree-window-tests-tests.exe.tests D:\a\_temp\saved.tests > nul
          exit /b 2
          '@ | Set-Content D:\a\_temp\wrap.cmd
          $ifeo = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\ui-tree-window-tests-tests.exe'
          New-Item -Force $ifeo | Out-Null
          Set-ItemProperty $ifeo -Name Debugger -Value 'C:\Windows\System32\cmd.exe /c D:\a\_temp\wrap.cmd'
          silk test --manifest-path modules/tree/window/tests/silk.toml --root src/tests.silk 2>&1 | Select-Object -Last 5
          "silk exit: $LASTEXITCODE"
          Remove-Item -Force $ifeo
          Get-Content D:\a\_temp\args.txt
          Get-ChildItem D:\a\_temp\saved.* | Format-Table Name,Length
          Copy-Item D:\a\_temp\saved.plan "$dev\ui-tree-window-tests-tests.exe.plan"
          $exe = "$dev\ui-tree-window-tests-tests.exe"
          $args1 = @('--silk-test-plan', '/D:/a/SilkUI/SilkUI/build/x86_64-pc-windows-msvc/dev/ui-tree-window-tests-tests.exe.plan', '--silk-test-result', '/D:/a/SilkUI/SilkUI/build/x86_64-pc-windows-msvc/dev/ui-tree-window-tests-tests.exe.receipt', '--silk-test-progress', '/D:/a/SilkUI/SilkUI/build/x86_64-pc-windows-msvc/dev/ui-tree-window-tests-tests.exe.progress', '--silk-test-timeout', '60')
          & $exe @args1
          "direct exit without record: $LASTEXITCODE"
          $cdb = 'C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe'
          $cmds = '.reload /f ntdll.dll; bp ntdll!NtCreateFile "dS poi(@r8+10); gu; r rax; g"; bp ntdll!NtOpenFile "dS poi(@r8+10); gu; r rax; g"; bp ntdll!NtQueryAttributesFile "dS poi(@rcx+10); gu; r rax; g"; bp ntdll!NtQueryFullAttributesFile "dS poi(@rcx+10); gu; r rax; g"; bp ntdll!NtReadFile "r rcx, rdx; gu; r rax; g"; bp ntdll!NtWriteFile "r rcx; gu; r rax; g"; bp ntdll!NtQueryInformationFile "r rcx, r9; gu; r rax; g"; bp ntdll!RtlExitUserProcess "r rcx; k 20; q"; g'
          & $cdb -G -c $cmds $exe @args1 2>&1 | Select-String -NotMatch 'NatVis|ModLoad|Whitespace at start|commands were skipped|^\s*$' | Select-Object -Last 300
          exit 0
