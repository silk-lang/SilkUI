[package]
name = "vocalis"
description = "Vocalis: a voice analysis studio (live spectrogram, pitch, formants) in Loom, drawn with WebGPU"
version = "0.1.0"
silk-version = "0.1.0-dev.74+205aea3f5b2e"
kind = "executable"
exports = ["main", "vocalis", "dsp", "source"]

[dependencies]
loom = { git = "https://github.com/silk-lang/loom.git", rev = "af039963d35ae16ef1cb05e43b83653dd0911a7c", path = "modules/loom", package = "loom" }
loom_window = { git = "https://github.com/silk-lang/loom.git", rev = "af039963d35ae16ef1cb05e43b83653dd0911a7c", path = "modules/loom/window", package = "loom-window" }
